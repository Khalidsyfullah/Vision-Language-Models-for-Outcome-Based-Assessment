tion 1 or 2 variables, or answer irrelevant variables"}, {"example_id": "122_c2", "criterion_index": 2, "criterion_name": "Hemato-biochemical changes in rohu due to an increase of temparature", "max_score": 2.0, "answer_id": 122, "image_file": "images/122.png", "question": "1. What do you mean by climate and weather?  2. Mention the climate variables. 3. Increased water temperature altered hemato-biochemical parameters in rohu, explain.", "model_answer": "1. Definition of climate and weather: Climate: Climate is defined as an area's long-term weather patterns. The simplest way to describe climate is to look at average temperature and precipitation over time. It takes a long time to change.  Weather: Weather is the state of the atmosphere at a particular place during a short period of time. It can change within a short period of time, like minutes or hours.\n2. Climate variables: Climate variable can be cassified into three categories such as physical, chemical, and biological. Some climate variables that are measured as follows:\n3. Hemato-biochemical changes in rohu due to an increase of temparature  In rohu (Labeo rohita), increased water temperature causes thermal stress, which changes  normal blood and biochemical conditions. Usually, hemoglobin, RBC, glucose may rise at first because the fish needs more oxygen and energy to cope with stress,  while total protein and some ions may decrease due to disturbed metabolism and osmotic  imbalance.  Erythrocytic cellular abnormalities (ECA), erythrocytic nuclear abnormalities (ENA) may may also rise due to elevated temparature.  So, higher temperature alters hemato-biochemical parameters by affecting the  fish’s respiration, metabolism, and stress response.\nRubrics", "rubric_levels": "Excellent (2): Briefly describes the scientific process and altered parameters in an orderly manner | Good (1.75): Mentions the altered parameters properly, but does not mention the reasons | Average (1.25-1.5):  Mention 1 or 2  parameters properly and does not explain the cause also | Poor (=<1): Mention incomplete and irrelevant data"}, {"example_id": "205_c0", "criterion_index": 0, "criterion_name": "Understanding of schema and instance (2)", "max_score": 2.0, "answer_id": 205, "image_file": "images/205.png", "question": "Define schema and instance in a database system.\n\nThen, explain the following types of keys with suitable examples:\n- Super Key\n- Candidate Key\n- Primary Key\n- Unique Key\n- Composite Key\n\nFinally, consider the relation:\nStudent(SID, Name, Email, Phone)\n\nAssume:\n- Each student has a unique SID\n- Email is also unique\n- Multiple students may have the same name\n\nIdentify all possible keys for this relation and briefly justify your answer.", "model_answer": "Answer 1: Schema and Instance\n\nA schema is the logical structure of a database that defines tables, attributes, and relationships. It is stable and does not change frequently.\nAn instance is the actual data stored in the database at a specific moment in time.\n\nExample:\nSchema: Student(SID, Name, Email, Phone)\nInstance: (1, Rahim, rahim@gmail.com\n, 017xxx)\n\nTypes of Keys\nSuper Key: Any set of attributes that uniquely identifies a record.\nExample: {SID}, {Email}, {SID, Name}\nCandidate Key: Minimal super key (no redundant attribute).\nExample: {SID}, {Email}\nPrimary Key: Selected candidate key used to uniquely identify records.\nExample: SID\nUnique Key: Ensures uniqueness but may allow NULL values.\nExample: Email\nComposite Key: A key made using more than one attribute.\nExample: (SID, Phone) in some cases\nGiven Relation: Student(SID, Name, Email, Phone)\nCandidate Keys: SID, Email (both are unique)\nSuper Keys: Any combination containing SID or Email\nExample: {SID}, {Email}, {SID, Name}, {Email, Phone}\nPrimary Key: SID (assumed)\nUnique Key: Email\nComposite Key: Not required here since single attributes are already unique\n\nAnswer 2: Schema vs Instance\n\nSchema defines the structure of a database (tables, attributes, constraints). It is like a blueprint.\nInstance is the actual data stored in the database at a specific time.\n\nExample:\nSchema: Student(SID, Name, Email, Phone)\nInstance: (101, Karim, karim@gmail.com\n, 018xxx)\n\nTypes of Keys\nSuper Key: A set of attributes that can uniquely identify a tuple.\nExample: SID or (SID, Name)\nCandidate Key: A minimal version of super key with no extra attribute.\nExample: SID, Email\nPrimary Key: Chosen candidate key for identification.\nExample: SID\nUnique Key: Ensures all values are unique (can be multiple per table).\nExample: Email\nComposite Key: A key formed by combining multiple attributes.\nExample: (SID, Name) if needed\nKeys in Given Relation\n\nStudent(SID, Name, Email, Phone)\n\nSID → unique → candidate key\nEmail → unique → candidate key\nName → not unique\nPhone → not unique\n\n✔ Candidate Keys: SID, Email\n✔ Primary Key: SID\n✔ Super Keys: Any set containing SID or Email\n✔ Unique Key: Email\nAnswer 3: Schema and Instance\n\nA schema represents the structure of the database including table design and attributes.\nAn instance represents the current set of data stored in the database.\n\nExample:\nSchema: Student(SID, Name, Email, Phone)\nInstance: (201, Hasan, hasan@gmail.com\n, 017xxx)\n\nTypes of Keys\nSuper Key: Any attribute or combination that uniquely identifies a row.\nExample: SID, Email, (SID, Phone)\nCandidate Key: A minimal super key used for unique identification.\nExample: SID, Email\nPrimary Key: Selected candidate key to uniquely identify records.\nExample: SID\nUnique Key: Ensures uniqueness of values; multiple allowed per table.\nExample: Email\nComposite Key: Combination of multiple attributes used as a key.\nExample: (SID, Name)\nKey Identification in Student Relation\n\nStudent(SID, Name, Email, Phone)\n\nSID is unique → Candidate Key\nEmail is unique → Candidate Key\nName is not unique\nPhone is not unique\n\n✔ Candidate Keys: SID, Email\n✔ Primary Key: SID (chosen)\n✔ Super Keys: SID, Email, and their combinations\n✔ Unique Key: Email\n✔ Composite Key: Not necessary in this relation\nRubrics", "rubric_levels": "Excellent (2-4): Clearly defines schema and instance with correct distinction and suitable example | Good(1-3):  Mostly correct definitions with minor confusion or weak example | Average (0.5-1):  Basic idea but unclear or partially incorrect | Poor(0-0.3):  Incorrect or missing understanding"}, {"example_id": "205_c1", "criterion_index": 1, "criterion_name": "Explanation of different types of keys with examples (4)", "max_score": 4.0, "answer_id": 205, "image_file": "images/205.png", "question": "Define schema and instance in a database system.\n\nThen, explain the following types of keys with suitable examples:\n- Super Key\n- Candidate Key\n- Primary Key\n- Unique Key\n- Composite Key\n\nFinally, consider the relation:\nStudent(SID, Name, Email, Phone)\n\nAssume:\n- Each student has a unique SID\n- Email is also unique\n- Multiple students may have the same name\n\nIdentify all possible keys for this relation and briefly justify your answer.", "model_answer": "Answer 1: Schema and Instance\n\nA schema is the logical structure of a database that defines tables, attributes, and relationships. It is stable and does not change frequently.\nAn instance is the actual data stored in the database at a specific moment in time.\n\nExample:\nSchema: Student(SID, Name, Email, Phone)\nInstance: (1, Rahim, rahim@gmail.com\n, 017xxx)\n\nTypes of Keys\nSuper Key: Any set of attributes that uniquely identifies a record.\nExample: {SID}, {Email}, {SID, Name}\nCandidate Key: Minimal super key (no redundant attribute).\nExample: {SID}, {Email}\nPrimary Key: Selected candidate key used to uniquely identify records.\nExample: SID\nUnique Key: Ensures uniqueness but may allow NULL values.\nExample: Email\nComposite Key: A key made using more than one attribute.\nExample: (SID, Phone) in some cases\nGiven Relation: Student(SID, Name, Email, Pho    |\n+---------------------+\n| 6. Presentation     |\n+---------------------+\n| 5. Session          |\n+---------------------+\n| 4. Transport        |\n+---------------------+\n| 3. Network          |\n+---------------------+\n| 2. Data Link        |\n+---------------------+\n| 1. Physical         |\n+---------------------+\n1. Physical Layer\nThe Physical layer is responsible for transmitting raw bits over a physical medium. It deals with hardware components such as cables, connectors, and electrical signals, ensuring that data is physically sent from one device to another.\n\n2. Data Link Layer\nThe Data Link layer ensures reliable communication between directly connected devices by organizing data into frames and performing error detection. It also uses MAC addresses to identify devices within the same network.\n\n3. Network Layer\nThe Network layer handles logical addressing and routing, determining the best path for data packets to travel from the source to the destination across multiple networks. Protocols such as IP operate at this layer.\n\n4. Transport Layer\nThe Transport layer provides reliable data transfer through segmentation, flow control, and error recovery. It uses protocols like TCP for reliable communication and UDP for faster, connectionless transmission.\n\n5. Session Layer\nThe Session layer is responsible for establishing, managing, and terminating communication sessions between applications. It maintains synchronization and controls the dialog during data exchange.\n\n6. Presentation Layer\nThe Presentation layer focuses on data representation by translating, encrypting, and compressing data so that it can be properly understood by the receiving system. Technologies such as SSL/TLS operate at this level.\n\n7. Application Layer\nThe Application layer is the topmost layer and provides network services directly to end users and applications. It enables interaction with the network through protocols such as HTTP, FTP, and SMTP.\nRubrics", " \n✔ Unique Key: Email\n✔ Composite Key: Not necessary in this relation\nRubrics", "rubric_levels": "Excellent (2-4): Clearly defines schema and instance with correct distinction and suitable example | Good(1-3):  Mostly correct definitions with minor confusion or weak example | Average (0.5-1):  Basic idea but unclear or partially incorrect | Poor(0-0.3):  Incorrect or missing understanding"}, {"example_id": "182_c1", "criterion_index": 1, "criterion_name": "Explanation of different types of keys with examples (4)", "max_score": 4.0, "answer_id": 182, "image_file": "images/182.png", "question": "Define schema and instance in a database system.\n\nThen, explain the following types of keys with suitable examples:\n- Super Key\n- Candidate Key\n- Primary Key\n- Unique Key\n- Composite Key\n\nFinally, consider the relation:\nStudent(SID, Name, Email, Phone)\n\nAssume:\n- Each student has a unique SID\n- Email is also unique\n- Multiple students may have the same name\n\nIdentify all possible keys for this relation and briefly justify your answer.", "model_answer": "Answer 1: Schema and Instance\n\nA schema is the logical structure of a database that defines tables, attributes, and relationships. It is stable and does not change frequently.\nAn instance is the actual data stored in the database at a specific moment in time.\n\nExample:\nSchema: Student(SID, Name, Email, Phone)\nInstance: (1, Rahim, rahim@gmail.com\n, 017xxx)\n\nTypes of Keys\nSuper Key: Any set of attributes that uniquely identifies a record.\nExample: {SID}, {Email}, {SID, Name}\nCandidate Key: Minimal super key (no redundant attribute).\nExample: {SID}, {Email}\nPrimary Key: Selected candidate key used to uniquely identify records.\nExample: SID\nUnique Key: Ensures uniqueness but may allow NULL values.\nExample: Email\nComposite Key: A key made using more than one attribute.\nExample: (SID, Phone) in some cases\nGiven Relation: Student(SID, Name, Email, Phone)\nCandidate Keys: SID, Email (both are uni : It reduces the number of bits required to store image data by limiting intensity levels.\nImage Compression: It plays a key role in compression techniques such as JPEG by reducing redundancy.\nSimplification: It simplifies image processing and analysis by reducing the range of pixel values.\nRole of Max-Lloyd Algorithm\n\nThe Max-Lloyd algorithm is an iterative optimization technique used to design an efficient quantizer by minimizing distortion, typically measured using Mean Squared Error (MSE).\nIt improves quantization by adapting the quantization levels based on the statistical distribution of image data.\nRole of Max-Lloyd Algorithm:\nThe Max-Lloyd algorithm is an optimization technique used to design an efficient quantizer by minimizing distortion, typically measured using Mean Squared Error (MSE). it is used to minimize quantization error (Mean Squared Error). It optimizes quantization levels based on data distribution using:\n             1. Boundary Condition: Decision boundaries are midpoints between levels\n             2. Centroid Condition: Each level equals the mean of assigned values\nThis iterative optimization reduces distortion and improves representation accuracy.\nRubrics for Digital Image Processing ", "rubric_levels": "Excellent (2.5): Clearly defines quantization as mapping continuous values to discrete levels AND mentions image/pixel context | Good (2): Defines quantization correctly but lacks context (e.g., image or pixels not mentioned) | Average (1.5): Mentions discretization but unclear or partially incorrect | Poor (1): No definition OR completely incorrect concept"}, {"example_id": "27_c1", "criterion_index": 1, "criterion_name": "Purpose of Quantization", "max_score": 2.5, "answer_id": 27, "image_file": "images/27.png", "question": "What is the purpose of quantization in image processing? Describe the role of the Max-Lloyd algorithm in minimizing distortion.", "model_answer": "Definition / Purpose of Quantization:\nQuantization is the process of converting a continuous range of pixel intensity values into a finite number of discrete levels. It is a fundamental step in digital image processing.\nPurpose of Quantization:\nThe main purposes of quantization are:\n\nData Reduction: It reduces the number of bits required to store image data by limiting intensity levels.\nImage Compression: It plays a key role in compression techniques such as JPEG by reducing redundancy.\nSimplification: It simplifies image processing and analysis by reducing the range of pixel values.\nRole of Max-Lloyd Algorithm\n\nThe Max-Lloyd algorithm is an iterative optimization technique used to design an efficient quantizer by minimizing distortion, typically measured using Mean Squared Error (MSE).\nIt improves quantization by adapting the quantization levels based on the statistical distribution of image data.\nRole of Max-Lloyd Algorithm:\nThe Max-Lloyd algorithm is an optimization technique used to design an efficient quantizer by minimizing distortion, typically measured using Mean Squared Error (MSE). it is used to minimize quantization error (Mean Squared Error). It optimizes quantization levels based on data distribution using:\n             1. Boundary Condition: Decision boundaries are midpoints between levels\n             2. Centroid Condition: Each level equals the mean of assigned values\nThis iterative optimization reduces distortion and improves representation accuracy.\nRubrics for Digital Image Processing ", "rubric_levels": "Excellent (2.5): Mentions at least 2–3 correct purposes (compression, storage reduction, simplification) with explanation | Good (2): Mentions 1–2 correct purposes but limited explanation | Average (1.5): Few purposes mentioned with limited understanding | Poor (1): No valid purpose stated"}, {"example_id": "27_c2", "criterion_index": 2, "criterion_name": "Max-Lloyd Algorithm Explanation", "max_score": 2.5, "answer_id": 27, "image_file": "images/27.png", "question": "What is the purpose of quantization in image processing? Describe the role of the Max-Lloyd algorithm in minimizing distortion.", "model_answer": "Definition / Purpose of Quantization:\nQuantization is the process of converting a continuous range of pixel intensity values into a finite number of discrete levels. It is a fundamental step in digital image processing.\nPurpose of Quantization:\nThe main purposes of quantization are:\n\nData Reduction: It reduces the number of bits required to store image data by limiting intensity levels.\nImage Compression: It plays a key role in compression techniques such as JPEG by reducing redundancy.\nSimplification: It simplifies image processing and analysis by reducing the range of pixel values.\nRole of Max-Lloyd Algorithm\n\nThe Max-Lloyd algorithm is an iterative optimization technique used to design an efficient quantizer by minimizing distortion, typically measured using Mean Squared Error (MSE).\nIt improves quantization by adapting the quantization levels based on the statistical distribution of image data.\nRole of Max-Lloyd Algorithm:\nThe Max-Lloyd algorithm is an optimization technique used to design an efficient quantizer by minimizing distortion, typically measured using Mean Squared Error (MSE). it is used to minimize quantization error (Mean Squared Error). It optimizes quantization levels based on data distribution using:\n             1. Boundary Condition: Decision boundaries are midpoints between levels\n             2. Centroid Condition: Each level equals the mean of assigned values\nThis iterative optimization reduces distortion and improves representation accuracy.\nRubrics for Digital Image Processing ", "rubric_levels": "Excellent (2.5): Clearly explains optimization goal (minimizing distortion/MSE) AND adaptive level selection | Good (2): Mentions algorithm and distortion but lacks clarity on how it works | Average (1.5): Mentions algorithm name only OR unclear explanation | Poor (1): Not mentioned or incorrect"}, {"example_id": "27_c3", "criterion_index": 3, "criterion_name": "Boundary & Centroid Conditions", "max_score": 2.5, "answer_id": 27, "image_file": "images/27.png", "question": "What is the purpose of quantization in image processing? Describe the role of the Max-Lloyd algorithm in minimizing distortion.", "model_answer": "Definition / Purpose of Quantization:\nQuantization is the process of converting a continuous range of pixel intensity values into a finite number of discrete levels. It is a fundamental step in digital image processing.\nPurpose of Quantization:\nThe main purposes of quantization are:\n\nData Reduction: It reduces the number of bits required to store image data by limiting intensity levels.\nImage Compression: It plays a key role in compression techniques such as JPEG by reducing redundancy.\nSimplification: It simplifies image processing and analysis by reducing the range of pixel values.\nRole of Max-Lloyd Algorithm\n\nThe Max-Lloyd algorithm is an iterative optimization technique used to design an efficient quantizer by minimizing distortion, typically measured using Mean Squared Error (MSE).\nIt improves quantization by adapting the quantization levels based on the statistical distribution of image data.\nRole of Max-Lloyd Algorithm:\nThe Max-Lloyd algorithm is an optimization technique used to design an efficient quantizer by minimizing distortion, typically measured using Mean Squared Error (MSE). it is used to minimize quantization error (Mean Squared Error). It optimizes quantization levels based on data distribution using:\n             1. Boundary Condition: Decision boundaries are midpoints between levels\n             2. Centroid Condition: Each level equals the mean of assigned values\nThis iterative optimization reduces distortion and improves representation accuracy.\nRubrics for Digital Image Processing ", "rubric_levels": "Excellent (2.5): Clearly explains BOTH conditions with correct meaning | Good (2): Explains only one condition correctly | Average (1.5): Mentions both but incorrectly or vaguely | Poor (1): Not mentioned"}, {"example_id": "101_c0", "criterion_index": 0, "criterion_name": "Concept of Histogram Equalization", "max_score": 4.0, "answer_id": 101, "image_file": "images/101.png", "question": "Question Q9: Explain necessity of histogram equalization and histogram matching in Image Processing. (10 Marks)", "model_answer": "Definition of Histogram Equalization\n\nHistogram Equalization is a technique used in image processing to enhance the contrast of an image by redistributing its intensity values so that they are spread more uniformly across the entire range.\nNecessity of Histogram Equalization\n\nHistogram equalization is necessary for several important reasons:\n\nContrast Enhancement: Many images suffer from low contrast where pixel values are concentrated in a narrow range. Histogram equalization spreads these values, improving contrast.\nBetter Visibility of Details: It enhances details in dark or bright regions, making features more distinguishable.\nImproved Image Interpretation: Useful in applications like medical imaging (e.g., X-rays, MRI), remote sensing, and surveillance systems.\nPreprocessing Step: Helps improve the performance of further image processing tasks such as segmentation and feature extraction.\nDefinition of Histogram Matching\n\nHistogram Matching (also called histogram specification) is a technique where the histogram of an input image is transformed to match the histogram of a reference image.\nNecessity of Histogram Matching\nHistogram matching is important due to the following reasons:\nConsistency Across Images: Ensures uniform appearance between multiple images.\nHandling Lighting Variations: Useful when images are captured under different lighting conditions.\nImproved Comparison: Makes image comparison more reliable by normalizing intensity distributions.\nBetter Performance in ML Systems: Enhances accuracy in image recognition and machine learning models.\nImage Normalization: Helps in standardizing datasets for analysis.\nRubrics for Digital Image Processing", "rubric_levels": "Excellent (4): Clearly defines and explains redistribution of intensity values with purpose of contrast enhancement | Good (3): Correct but missing one key aspect | Average (2): Basic idea present but unclear | Poor (1): Incorrect or missing definition"}, {"example_id": "101_c1", "criterion_index": 1, "criterion_name": "Necessity of Histogram Equalization", "max_score": 4.0, "answer_id": 101, "image_file": "images/101.png", "question": "Question Q9: Explain necessity of histogram equalization and histogram matching in Image Processing. (10 Marks)", "model_answer": "Definition of Histogram Equalization\n\nHistogram Equalization is a technique used in image processing to enhance the contrast of an image by redistributing its intensity values so that they are spread more uniformly across the entire range.\nNecessity of Histogram Equalization\n\nHistogram equalization is necessary for several important reasons:\n\nContrast Enhancement: Many images suffer from low contrast where pixel values are concentrated in a narrow range. Histogram equalization spreads these values, improving contrast.\nBetter Visibility of Details: It enhances details in dark or bright regions, making features more distinguishable.\nImproved Image Interpretation: Useful in applications like medical imaging (e.g., X-rays, MRI), remote sensing, and surveillance systems.\nPreprocessing Step: Helps improve the performance of further image processing tasks such as segmentation and feature extraction.\nDefinition of Histogram Matching\n\nHistogram Matching (also called histogram specification) is a technique where the histogram of an input image is transformed to match the histogram of a reference image.\nNecessity of Histogram Matching\nHistogram matching is important due to the following reasons:\nConsistency Across Images: Ensures uniform appearance between multiple i ue where the histogram of an input image is transformed to match the histogram of a reference image.\nNecessity of Histogram Matching\nHistogram matching is important due to the following reasons:\nConsistency Across Images: Ensures uniform appearance between multiple images.\nHandling Lighting Variations: Useful when images are captured under different lighting conditions.\nImproved Comparison: Makes image comparison more reliable by normalizing intensity distributions.\nBetter Performance in ML Systems: Enhances accuracy in image recognition and machine learning models.\nImage Normalization: Helps in standardizing datasets for analysis.\nRubrics for Digital Image Processing", "rubric_levels": "Excellent (4): Clearly explains transformation using reference histogram | Good (3): Correct but lacks one key detail | Average (2): Partial understanding | Poor (1): Incorrect or missing"}, {"example_id": "101_c3", "criterion_index": 3, "criterion_name": "Necessity of Histogram Matching", "max_score": 4.0, "answer_id": 101, "image_file": "images/101.png", "question": "Question Q9: Explain necessity of histogram equalization and histogram matching in Image Processing. (10 Marks)", "model_answer": "Definition of Histogram Equalization\n\nHistogram Equalization is a technique used in image processing to enhance the contrast of an image by redistributing its intensity values so that they are spread more uniformly across the entire range.\nNecessity of Histogram Equalization\n\nHistogram equalization is necessary for several important reasons:\n\nContrast Enhancement: Many images suffer from low contrast where pixel values are concentrated in a narrow range. Histogram equalization spreads these values, improving contrast.\nBetter Visibility of Details: It enhances details in dark or bright regions, making features more distinguishable.\nImproved Image Interpretation: Useful in applications like medical imaging (e.g., X-rays, MRI), remote sensing, and surveillance systems.\nPreprocessing Step: Helps improve the performance of further image processing tasks such as segmentation and feature extraction.\nDefinition of Histogram Matching\n\nHistogram Matching (also called histogram specification) is a technique where the histogram of an input image is transformed to match the histogram of a reference image.\nNecessity of Histogram Matching\nHistogram matching is important due to the following reasons:\nConsistency Across Images: Ensures uniform appearance between multiple images.\nHandling Lighting Variations: Useful when images are captured under different lighting conditions.\nImproved Comparison: Makes image comparison more reliable by normalizing intensity distributions.\nBetter Performance in ML Systems: Enhances accuracy in image recognition and machine learning models.\nImage Normalization: Helps in standardizing datasets for analysis.\nRubrics for Digital Image Processing", "rubric_levels": "Excellent (4): Clearly explains multiple uses including consistency and ML applications | Good (3): Some correct points but incomplete | Average (2): Limited explanation | Poor (1): Incorrect or irrelevant explanation"}, {"example_id": "358_c0", "criterion_index": 0, "criterion_name": "Understanding of Concept", "max_score": 4.0, "answer_id": 358, "image_file": "images/358.png", "question": "Question 1. You are given the following values: 12, -5.4, 10000, 3.14, 0, 87, -200, 45.6, 999, 1.2. Choose the most efficient among Counting Sort, Radix Sort, or Bucket Sort for this dataset. Justify your selection and state the time and space complexity of all three algorithms.\n2. A directed weighted graph is given below. Determine whether the graph contains a negative cycle using a step-by-step solution. Graph (text form): Vertices = {A, B, C, D}; Edges = A→B (4), B→C (-6), C→D (2), D→B (1), A→D (5).\n3. You are given coin denominations: 1, 3, 4, 5. Find the minimum number of coins required to make 10 taka. Show the DP table and derive the final answer.", "mo l policy that maximizes cumulative reward over time.\nExamples include game playing, robotics, and self-driving systems.\nRubrics for Machine Learning", "rubric_levels": "Excellent (2.5): All three types clearly distinguished and well-organized | Good (2): Mostly clear but slight confusion between types | Average (1.5): Some mixing of concepts | Poor (1): Poor or unclear explanation"}, {"example_id": "277_c0", "criterion_index": 0, "criterion_name": "Identification of Layers (2 Marks)", "max_score": 2.0, "answer_id": 277, "image_file": "images/277.png", "question": "Q19: describe the 7 layers of OSI model (10 Marks)", "model_answer": "The OSI (Open Systems Interconnection) model is a conceptual framework that divides network communication into seven layers, each responsible for a specific function. This layered approach helps in understanding, designing, and troubleshooting network systems.\nOSI Model Diagram\n+---------------------+\n| 7. Application      |\n+---------------------+\n| 6. Presentation     |\n+---------------------+\n| 5. Session          |\n+---------------------+\n| 4. Transport        |\n+---------------------+\n| 3. Network          |\n+---------------------+\n| 2. Data Link        |\n+---------------------+\n| 1. Physical         |\n+---------------------+\n1. Physical Layer\nThe Physical layer is responsible for transmitting raw bits over a physical medium. It deals with hardware components such as cables, connectors, and electrical signals, ensuring that data is physically sent from one device to another.\n\n2. Data Link Layer\nThe Data Link layer ensures reliable communication between directly connected devices by organizing data into frames and performing error detection. It also uses MAC addresses to identify devices within the same network.\n\n3. Network Layer\nThe Network layer handles logical addressing and routing, determining the best path for data packets to travel from the source to the destination across multiple networks. Protocols such as IP operate at this layer.\n\n4. Transport Layer\nThe Transport layer provides reliable data transfer through segmentation, flow control, and error recovery. It uses protocols like TCP for reliable communication and UDP for faster, connectionless transmission.\n\n5. Session Layer\nThe Session layer is responsible for establishing, managing, and terminating communication sessions between applications. It maintains synchronization and controls the dialog during data exchange.\n\n6. Presentation Layer\nThe Presentation layer focuses on data representation by translating, encrypting, and compressing data so that it can be properly understood by the receiving system. Technologies such as SSL/TLS operate at this level.\n\n7. Application Layer\nThe Application layer is the topmost layer and provides network services directly to end users and applications. It enables interaction with the network through protocols such as HTTP, FTP, and SMTP.\nRubrics", "rubric_levels": "Excellent: All 7 layers listed in correct order (2.0) | Good: 5–6 correct, minor order issue (1.5) | Average: 3–4 correct (1.0) | Poor: ≤2 or incorrect (0–0.5)"}, {"example_id": "277_c1", "criterion_index": 1, "criterion_name": "Explanation of Layers with diagram (4 Marks)", "max_score": 4.0, "answer_id": 277, "image_file": "images/277.png", "question": "Q19: describe the 7 layers of OSI model (10 Marks)", "model_answer": "The OSI (Open Systems Interconnection) model is a conceptual framework that divides network communication into seven layers, each responsible for a specific function. This layered approach helps in understanding, designing, and troubleshooting network systems.\nOSI Model Diagram\n+---------------------+\n| 7. Application      |\n+---------------------+\n| 6. Presentation     |\n+---------------------+\n| 5. Session          |\n+---------------------+\n| 4. Transport        |\n+---------------------+\n| 3. Network          |\n+---------------------+\n| 2. Data Link        |\n+------ action with the network through protocols such as HTTP, FTP, and SMTP.\nRubrics", "rubric_levels": "Excellent: Very clear, neat diagrams/tables, strong justification (1.0) | Good: Clear explanation (0.75) | Average: Understandable but not neat (0.5) | Poor: Poorly organized (0-0.25)"}, {"example_id": "169_c0", "criterion_index": 0, "criterion_name": "Understanding of normalization and related problems(3)", "max_score": 3.0, "answer_id": 169, "image_file": "images/169.png", "question": "Question 1. In database systems, poor design can lead to data redundancy and update anomalies.", "model_answer": "Answer 1: Poor database design leads to data redundancy and update anomalies. Redundancy means storing the same data repeatedly, which increases storage and causes inconsistency. The main anomalies are:\n\nInsertion anomaly: Cannot insert data without adding unrelated information\nDeletion anomaly: Deleting a record may remove useful data\nUpdate anomaly: Same data must be updated in multiple rows\n\nNormalization is used to organize data and eliminate these problems.\n\nNormal Forms:\n\n1NF: Ensures atomic values and removes repeating groups\n2NF: Removes partial dependency (non-key depends on full primary key)\n3NF: Removes transitive dependency (non-key depends only on primary key)\n\nExample:\n\nUnnormalized Table:\nStudentID | Course | Instructor | InstructorPhone\n1 | DBMS | Rahim | 017XX\n1 | AI | Karim | 018XX\n\nProblems: Instructor data is repeated → redundancy and update anomaly.\n\nAfter Normalization:\n\nStudentCourse:\nStudentID | Course\n\nCourseInstructor:\nCourse | Instructor | InstructorPhone\n\nNow redundancy is minimized and anomalies are removed.\nAnswer 2:A poorly designed database suffers from redundancy and update anomalies, which reduce data consistency.\n\nSuppose we have a table:\nOrderID | CustomerName | CustomerAddress | Product\n\nIf a customer places multiple orders, their address is stored repeatedly → data redundancy.\n\nAnomalies:\n\nInsertion anomaly: Cannot add a new customer without an order\nDeletion anomaly: Deleting last order removes customer info\nUpdate anomaly: Changing address requires multiple updates\n\nTo solve this, we apply normalization.\n\nNormal Forms:\n\n1NF: Removes repeating attributes\n2NF: Eliminates partial dependency\n3NF: Eliminates transitive dependency\n\nNormalized Tables:\n\nCustomer:\nCustomerID | Name | Address\n\nOrder:\nOrderID | CustomerID | Product\n\nNow each fact is stored once, reducing redundancy and eliminating anomalies.\nAnswer 3: Poor database design causes redundant data storage and anomalies (insertion, deletion, update), leading to inconsistency.\n\nNormalization is a step-by-step process to improve database structure.\n\nExample (Unnormalized Table):\nStudentID | StudentName | Course | Instructor | InstructorOffice\n\nProblems:\n\nInstructor details repeated → redundancy\nUpdate anomaly if instructor office changes\nStep 1: Convert to 1NF\n\nEnsure atomic values (already satisfied, no repeating groups)\n\nStep 2: Convert to 2NF\n\nRemove partial dependency:\n\nStudentName depends only on StudentID\n\nStudent Table:\nStudentID | StudentName\n\nStep 3: Convert to 3NF\n\nRemove transitive dependency:\n\nInstructorOffice depends on Instructor\n\nCourse Table:\nCourse | Instructor\n\nInstructor Table:\nInstructor | InstructorOffice\n\nNow:\n\nNo redundant data\nAll anomalies removed\nDatabase is well-structured\nRubrics", "rubric_levels": "Excellent (2/3): Clearly explains normalization purpose; correctly identifies redundancy and all anomalies (insertion, deletion, update) with reasoning | Good (0.5-2):  Explains normalization and anomalies but misses depth or one type | Average (0.2-0.5):  Basic idea; anomalies unclear or partially incorrect | Poor (0-0.2):  No clear understanding; mostly incorrect"}, {"example_id": "169_c1", "criterion_index": 1, "criterion_name": "Explanation of normal forms(3)", "max_score": 3.0, "answer_id": 169, "image_file": "images or issues | Average (0.2-0.5): Understandable but poorly structured | Poor (0-0.2):  Disorganized and unclear"}, {"example_id": "309_def", "criterion_index": 0, "criterion_name": "Definition of Data Mining", "max_score": 4.0, "answer_id": 309, "image_file": "images/309.png", "question": "What is Data Mining? Describe the steps of the KDD (Knowledge Discovery in Databases) process and explain why data mining is essential in modern organizations.", "model_answer": "Definition of Data Mining:\nData mining is the process of discovering meaningful patterns, knowledge, or useful information from large datasets using techniques from statistics, machine learning, and pattern recognition.\nSteps of the KDD Process:\nThe Knowledge Discovery in Databases (KDD) process includes the following main steps:\n1. Data Selection\n2. Data Preprocessing / Cleaning\n3. Data Transformation\n4. Data Mining\n5. Pattern Evaluation\n6. Knowledge Presentation\nJustification / Importance of Data Mining:\nData mining is essential in modern organizations because it enables data-driven decision making and provides insights that would otherwise remain hidden in large datasets. By analyzing customer behavior, transaction patterns, and market trends, organizations can make strategic decisions that improve efficiency, increase revenue, and reduce risks.\n\nFor example, a retail company can analyze purchase histories to recommend products to customers, thereby increasing sales and enhancing customer satisfaction. Similarly, banks can detect fraudulent transactions by identifying unusual patterns in account activity, which helps prevent financial losses.\nRubrics for DataMining ", "rubric_levels": "Excellent (4): Clear and correct definition explaining discovery of useful patterns/knowledge from large datasets | Good (3): Correct definition but slightly incomplete | Average (2): Basic idea mentioned but not clearly defined | Poor (0-1): Incorrect or missing definition"}, {"example_id": "309_kdd", "crite etermines which method will be executed.\n\nDefinition of Method Overriding: \nMethod overriding occurs when a subclass provides a new implementation of a method already defined in the parent class using the same method signature. It is an example of run-time polymorphism because the method call is resolved during execution.\n\nComparison:\n| Method Overloading                                              | Method Overriding                                              |\n| --------------------------------------                         | ----------------------------------------                     |\n| Happens within the same class                         | Happens between parent and child classes |\n| Same method name, different parameters | Same method name, same parameters        |\n| Compile-time polymorphism                            | Run-time polymorphism                                     |\n| Inheritance not required                                     | Inheritance required                                             |\n\n\n\n\n\nExample:\n\nclass Area {\n    int calculate(int side) {\n        return side * side;\n    }\n\n    int calculate(int length, int width) {\n        return length * width;\n    }\n}\n\nclass Bird {\n    void fly() {\n        System.out.println(\"Bird flies\");\n    }\n}\n\nclass Sparrow extends Bird {\n    void fly() {\n        System.out.println(\"Sparrow flies low\");\n    }\n}\n\ncalculate() is overloaded and fly() is overridden..", "rubric_levels": "Excellent (4): Clearly defines method\n overloading as same\n method name with different\n parameter lists in the same\n class; mentions compile-time \npolymorphism correctly | Good (3): Defines correctly but \nmisses one important aspect\n(e.g., compile-time polymorphism \nor parameter variation) | Average (2): Partial definition with \nlimited clarity | Poor (1): Incorrect or missing definition"}, {"example_id": "469_c1", "criterion_index": 1, "criterion_name": "Definition of Met s Sparrow extends Bird {\n    void fly() {\n        System.out.println(\"Sparrow flies low\");\n    }\n}\n\ncalculate() is overloaded and fly() is overridden..", "rubric_levels": "Excellent (4): Provides correct and \ncomplete programming \nexample for both overloading\n and overriding with clear \nexplanation | Good (3): Example mostly\ncorrect\n with minor error | Average (2): Partial example or \nonly one concept shown | Poor (1): No valid example"}, {"example_id": "75_c0", "criterion_index": 0, "criterion_name": "Concept of Histogram Equalization", "max_score": 4.0, "answer_id": 75, "image_file": "images/75.png", "question": "Question Q9: Explain necessity of histogram equalization and histogram matching in Image Processing. (10 Marks)", "model_answer": "Definition of Histogram Equalization\n\nHistogram Equalization is a technique used in image processing to enhance the contrast of an image by redistributing its intensity values so that they are spread more uniformly across the entire range.\nNecessity of Histogram Equalization\n\nHistogram equalization is necessary for several important reasons:\n\nContrast Enhancement: Many images suffer from low contrast where pixel values are concentrated in a narrow range. Histogram equalization spreads these values, improving contrast.\nBetter Visibility of Details: It enhances details in dark or bright regions, making features more distinguishable.\nImproved Image Interpretation: Useful in applications like medical imaging (e.g., X-rays, MRI), remote sensing, and surveillance systems.\nPreprocessing Step: Helps improve the performance of further image processing tasks such as segmentation and feature extraction.\nDefinition of Histogram Matching\n\nHistogram Matching (also called histogram specification) is a technique where the histogram of an input image is transformed to match the histogram of a reference image.\nNecessity of Histogram Matching\nHistogram matching is important due to the following reasons:\nConsistency Across Images: Ensures uniform appearance between multiple images.\nHandling Lighting Variations: Useful when images are captured under different lighting conditions.\nImproved Comparison: Makes image comparison more reliable by normalizing intensity distributions.\nBetter Performance in ML Systems: Enhances accuracy in image recognition and machine learning models.\nImage Normalization: Helps in standardizing datasets for analysis.\nRubrics for Digital Image Processing", "rubric_levels": "Excellent (4): Clearly defines and explains redistribution of intensity values with purpose of contrast enhancement | Good (3): Correct but missing one key aspect | Average (2): Basic idea present but unclear | Poor (1): Incorrect or missing definition"}, {"example_id": "75_c1", "criterion_index": 1, "criterion_name": "Necessity of Histogram Equalization", "max_score": 4.0, "answer_id": 75, "image_file": "images/75.png", "question": "Question Q9: Explain necessity of histogram equalization and histogram matching in Image Processing. (10 Marks)", "model_answer": "Definition of Histogram Equalization\n\nHistogram Equalization is a technique used in image processing to enhance the contrast of an image by redistributing its intensity values so that they are spread more uniformly across the entire range.\nNecessity of Histogram Equalization\n\nHistogram equalization is necessary for several important reasons:\n\nContrast Enhancement: Many images suffer from low contrast where pixel values are concentrated in a narrow range. Histogram equalization spreads these values, improving contrast.\nBetter Visibility of Details: It enhances details in dark or bright regions, making features more distinguishable.\nImproved Image Interpretation: Useful in applications like medical imaging (e.g., X-rays, MRI), remote sensing, and surveillance systems.\nPreprocessing Step: Helps improve the performance of further image processing tasks such as segmentation and feature extraction.\nDefinition of Hist SID\n- Email is also unique\n- Multiple students may have the same name\n\nIdentify all possible keys for this relation and briefly justify your answer.", "model_answer": "Answer 1: Schema and Instance\n\nA schema is the logical structure of a database that defines tables, attributes, and relationships. It is stable and does not change frequently.\nAn instance is the actual data stored in the database at a specific moment in time.\n\nExample:\nSchema: Student(SID, Name, Email, Phone)\nInstance: (1, Rahim, rahim@gmail.com\n, 017xxx)\n\nTypes of Keys\nSuper Key: Any set of attributes that uniquely identifies a record.\nExample: {SID}, {Email}, {SID, Name}\nCandidate Key: Minimal super key (no redundant attribute).\nExample: {SID}, {Email}\nPrimary Key: Selected candidate key used to uniquely identify records.\nExample: SID\nUnique Key: Ensures uniqueness but may allow NULL values.\nExample: Email\nComposite Key: A key made using more than one attribute.\nExample: (SID, Phone) in some cases\nGiven Relation: Student(SID, Name, Email, Phone)\nCandidate Keys: SID, Email (both are unique)\nSuper Keys: Any combination containing SID or Email\nExample: {SID}, {Email}, {SID, Name}, {Email, Phone}\nPrimary Key: SID (assumed)\nUnique Key: Email\nComposite Key: Not required here since single attributes are already unique\n\nAnswer 2: Schema vs Instance\n\nSchema defines the structure of a database (tables, attributes, constraints). It is like a blueprint.\nInstance is the actual data stored in the database at a specific time.\n\nExample:\nSchema: Student(SID, Name, Email, Phone)\nInstance: (101, Karim, karim@gmail.com\n, 018xxx)\n\nTypes of Keys\nSuper Key: A set of attributes that can uniquely identify a tuple.\nExample: SID or (SID, Name)\nCandidate Key: A minimal version of super key with no extra attribute.\nExample: SID, Email\nPrimary Key: Chosen candidate key for identification.\nExample: SID\nUnique Key: Ensures all values are unique (can be multiple per table).\nExample: Email\nComposite Key: A key formed by combining multiple attributes.\nExample: (SID, Name) if needed\nKeys in Given Relation\n\nStudent(SID, Name, Email, Phone)\n\nSID → unique → candidate key\nEmail → unique → candidate key\nName → not unique\nPhone → not unique\n\n✔ Candidate Keys: SID, Email\n✔ Primary Key: SID\n✔ Super Keys: Any set containing SID or Email\n✔ Unique Key: Email\nAnswer 3: Schema and Instance\n\nA schema represents the structure of the database including table design and attributes.\nAn instance represents the current set of data stored in the database.\n\nExample:\nSchema: Student(SID, Name, Email, Phone)\nInstance: (201, Hasan, hasan@gmail.com\n, 017xxx)\n\nTypes of Keys\nSuper Key: Any attribute or combination that uniquely identifies a row.\nExample: SID, Email, (SID, Phone)\nCandidate Key: A minimal super key used for unique identification.\nExample: SID, Email\nPrimary Key: Selected candidate key to uniquely identify records.\nExample: SID\nUnique Key: Ensures uniqueness of values; multiple allowed per table.\nExample: Email\nComposite Key: Combination of multiple attributes used as a key.\nExample: (SID, Name)\nKey Identification in Student Relation\n\nStudent(SID, Name, Email, Phone)\n\nSID is unique → Candidate Key\nEmail is unique → Candidate Key\nName is not unique\nPhone is not unique\n\n✔ Candidate Keys: SID, Email\n✔ Primary Key: SID (chosen)\n✔ Super Keys: SID, Email, and their combinations\n✔ Unique Key: Email\n✔ Composite Key: Not necessary in this relation\nRubrics", "rubric_levels": "Excellent (2-4): Clearly defines schema and instance with correct distinction and suitable example | Good(1-3):  Mostly correct definitions with minor confusion or weak example | Average (0.5-1):  Basic idea but unclear or partially incorrect | Poor(0-0.3):  Incorrect or missing understanding"}, {"example_id": "208_c1", "criterion_index": 1, "criterion_name": "Explanation of different types of keys with examples (4)", "max_score": 4.0, "answer_id" 0, "answer_id": 281, "image_file": "images/281.png", "question": "What is Data Mining? Describe the steps of the KDD (Knowledge Discovery in Databases) process and explain why data mining is essential in modern organizations.", "model_answer": "Definition of Data Mining:\nData mining is the process of discovering meaningful patterns, knowledge, or useful information from large datasets using techniques from statistics, machine learning, and pattern recognition.\nSteps of the KDD Process:\nThe Knowledge Discovery in Databases (KDD) process includes the following main steps:\n1. Data Selection\n2. Data Preprocessing / Cleaning\n3. Data Transformation\n4. Data Mining\n5. Pattern Evaluation\n6. Knowledge Presentation\nJustification / Importance of Data Mining:\nData mining is essential in modern organizations because it enables data-driven decision making and provides insights that would otherwise remain hidden in large datasets. By analyzing customer behavior, transaction patterns, and market trends, organizations can make strategic decisions that improve efficiency, increase revenue, and reduce risks.\n\nFor example, a retail company can analyze purchase histories to recommend products to customers, thereby increasing sales and enhancing customer satisfaction. Similarly, banks can detect fraudulent transactions by identifying unusual patterns in account activity, which helps prevent financial losses.\nRubrics for DataMining ", "rubric_levels": "Excellent (4): Clear and correct definition explaining discovery of useful patterns/knowledge from large datasets | Good (3): Correct definition but slightly incomplete | Average (2): Basic idea mentioned but not clearly defined | Poor (0-1): Incorrect or missing definition"}, {"example_id": "281_kdd", "criterion_index": 1, "criterion_name": "KDD Process Steps", "max_score": 4.0, "answer_id": 281, "image_file": "images/281.png", "question": "What is Data Mining? Describe the steps of the KDD (Knowledge Discovery in Databases) p DD Process:\nThe Knowledge Discovery in Databases (KDD) process includes the following main steps:\n1. Data Selection\n2. Data Preprocessing / Cleaning\n3. Data Transformation\n4. Data Mining\n5. Pattern Evaluation\n6. Knowledge Presentation\nJustification / Importance of Data Mining:\nData mining is essential in modern organizations because it enables data-driven decision making and provides insights that would otherwise remain hidden in large datasets. By analyzing customer behavior, transaction patterns, and market trends, organizations can make strategic decisions that improve efficiency, increase revenue, and reduce risks.\n\nFor example, a retail company can analyze purchase histories to recommend products to customers, thereby increasing sales and enhancing customer satisfaction. Similarly, banks can detect fraudulent transactions by identifying unusual patterns in account activity, which helps prevent financial losses.\nRubrics for DataMining ", "rubric_levels": "Excellent (4): Relevant real-world example provided (e.g., marketing, fraud detection, recommendation systems) | Good (3): Example provided but not well explained | Average (2): Vague or unclear example | Poor (0-1): No example"}, {"example_id": "259_c0", "criterion_index": 0, "criterion_name": "Identification of Layers (2 Marks)", "max_score": 2.0, "answer_id": 259, "image_file": "images/259.png", "question": "Q19: describe the 7 layers of OSI model (10 Marks)", "model_answer": "The OSI (Open Systems Interconnection) model is a conceptual framework that divides network communication into seven layers, each responsible for a specific function. This layered approach helps in understanding, designing, and troubleshooting network systems.\nOSI Model Diagram\n+---------------------+\n| 7. Application      |\n+---------------------+\n| 6. Presentation     |\n+---------------------+\n| 5. Session          |\n+---------------------+\n| 4. Transport        |\n+---------------------+\n| 3. Network          |\n+---------------------+\n| 2. Data Link        |\n+---------------------+\n| 1. Physical         |\n+---------------------+\n1. Physical Layer\nThe Physical layer is responsible for transmitting raw bits over a physical medium. It deals with hardware components such as cables, connectors, and electrical signals, ensuring that data is physically sent from one device to another.\n\n2. Data Link Layer\nThe Data Link layer ensures reliable communication between directly connected devices by organizing data into frames and performing error detection. It also uses MAC addresses to identify devices within the same network.\n\n3. Network Layer\nThe Network layer handles logical addressing and routing, determining the best path for data packets to travel from the source to the destination across multiple networks. Protocols such as IP operate at this layer.\n\n4. Transport Layer\nThe Transport layer provides reliable data transfer through segmentation, flow control, and error recovery. It uses protocols like TCP for reliable communication and UDP for faster, connectionless transmission.\n\n5. Session Layer\nThe Session layer is responsible for establishing, managing, and terminating communication sessions between applications. It maintains synchronization and controls the dialog during data exchange.\n\n6. Presentation Layer\nThe Presentation layer focuses on data representation by translating, encrypting, and compressing data so that it can be properly understood by the receiving system. Technologies such as SSL/TLS operate at this level.\n\n7. Application Layer\nThe Application layer is the topmost layer and provides network services directly to end users and applications. It enables interaction with the network through protocols such as HTTP, FTP, and SMTP.\nRubrics", "rubric_levels": "Excellent: All 7 layers listed in correct order (2.0) | Good: 5–6 correct, minor order issue (1.5) | Average: 3–4 correct (1.0) | Poor: ≤2 or incorrect (0–0.5)"}, {"example_id": "259_c1", d provides network services directly to end users and applications. It enables interaction with the network through protocols such as HTTP, FTP, and SMTP.\nRubrics", "rubric_levels": "Excellent: Relevant examples for multiple layers (1.0) | Good: Some examples (0.5–0.75) | Average: Very Few Examples (0.25) | Poor: No examples (0)"}, {"example_id": "259_c4", "criterion_index": 4, "criterion_name": "Clarity & Organization (1 Mark)", "max_score": 1.0, "answer_id": 259, "image_file": "images/259.png", "question": "Q19: describe the 7 layers of OSI model (10 Marks)", "model_answer": "The OSI (Open Systems Interconnection) model is a conceptual framework that divides network communication into seven layers, each responsible for a specific function. This layered approach helps in understanding, designing, and troubleshooting network systems.\nOSI Model Diagram\n+---------------------+\n| 7. Application      |\n+---------------------+\n| 6. Presentation     |\n+---------------------+\n| 5. Session          |\n+---------------------+\n| 4. Transport        |\n+---------------------+\n| 3. Network          |\n+---------------------+\n| 2. Data Link        |\n+---------------------+\n| 1. Physical         |\n+---------------------+\n1. Physical Layer\nThe Physical layer is responsible for transmitting raw bits over a physical medium. It deals with hardware components such as cables, connectors, and electrical signals, ensuring that data is physically sent from one device to another.\n\n2. Data Link Layer\nThe Data Link layer ensures reliable communication between directly connected devices by organizing data into frames and performing error detection. It also uses MAC addresses to identify devices within the same network.\n\n3. Network Layer\nThe Network layer handles logical addressing and routing, determining the best path for data packets to travel from the source to the destination across multiple networks. Protocols such as IP operate at this layer.\n\n4. Transport Layer\nThe Transport layer provides reliable data transfer through segmentation, flow control, and error recovery. It uses protocols like TCP for reliable communication and UDP for faster, connectionless transmission.\n\n5. Session Layer\nThe Session layer is responsible for establishing, managing, and terminating communication sessions between applications. It maintains synchronization and controls the dialog during data exchange.\n\n6. Presentation Layer\nThe Presentation layer focuses on data representation by translating, encrypting, and compressing data so that it can be properly understood by the receiving system. Technologies such as SSL/TLS operate at this level.\n\n7. Application Layer\nThe Application layer is the topmost layer and provides network services directly to end users and applications. It enables interaction with the network through protocols such as HTTP, FTP, and SMTP.\nRubrics", "rubric_levels": "Excellent: Very clear, neat diagrams/tables, strong justification (1.0) | Good: Clear explanation (0.75) | Average: Understandable but not neat (0.5) | Poor: Poorly organized (0-0.25)"}, {"example_id": "147_c0", "criterion_index": 0, "criterion_name": "Understanding of normalization and related problems(3)", "max_score": 3.0, "answer_id": 147, "image_file": "images/147.png", "question": "Question 1. In database systems, poor design can lead to data redundancy and update anomalies.", "model_answer": "Answer 1: Poor database design leads to data redundancy and update anomalies. Redundancy means storing the same data repeatedly, which increases storage and causes inconsistency. The main anomalies are:\n\nInsertion anomaly: Cannot insert data without adding unrelated information\nDeletion anomaly: Deleting a record may remove useful data\nUpdate anomaly: Same data must be updated in multiple rows\n\nNormalization is used to organize data and eliminate these problems.\n\nNormal Forms:\n\n1NF: Ensures atomic values and removes repeating groups\n2NF: Removes partial dependency (non-key depends on full primary key)\n3NF: Removes transitive dependency (non-key depends only on primary key)\n\nExample:\n\nUnnormalized Table:\nStudentID | Course | Instructor | InstructorPhone\n1 | DBMS | Rahim | 017XX\n1 | AI | Karim | 018XX\n\nProblems: Instructor data is repeated → redundancy and update anomaly.\n\nAfter Normalization:\n\nStudentCourse:\nStudentID | Course\n\nCourseInstructor:\nCourse | Instructor | InstructorPhone\n\nNow redundancy is minimized and anomalies are removed.\nAnswer 2:A poorly designed database suffers from redundancy and update anomalies, which reduce data consistency.\n\nSuppose we have a table:\nOrderID | CustomerName | CustomerAddress | Product\n\nIf a customer places multiple orders, their address is stored repeatedly → data redundancy.\n\nAnomalies:\n\nInsertion anomaly: Cannot add a new customer without an order\nDeletion anomaly: Deleting last order removes customer info\nUpdate anomaly: Changing address requires multiple updates\n\nTo solve this, we apply normalization.\n\nNormal Forms:\n\n1NF: Removes repeating attributes\n2NF: Eliminates partial dependency\n3NF: Eliminates transitive dependency\n\nNormalized Tables:\n\nCustomer:\nCustomerID | Name | Address\n\nOrder:\nOrderID | CustomerID | Product\n\nNow each fact is stored once, reducing redundancy and eliminating anomalies.\nAnswer 3: Poor database design causes redundant data storage and anomalies (insertion, deletion, update), leading to inconsistency.\n\nNormalization is a step-by-step process to improve database structure.\n\nExample (Unnormalized Table):\nStudentID | StudentName | Course | Instructor | InstructorOffice\n\nProblems:\n\nInstructor details repeated → redundancy\nUpdate anomaly if instructor office changes\nStep 1: Convert to 1NF\n\nEnsure atomic values (already satisfied, no repeating groups)\n\nStep 2: Convert to 2NF\n\nRemove partial dependency:\n\nStudentName depends only on StudentID\n\nStudent Table:\nStudentID | StudentName\n\nStep 3: Convert to 3NF\n\nRemove transitive dependency:\n\nInstructorOffice depends on Instructor\n\nCourse Table:\nCourse | Instructor\n\nInstructor Table:\nInstructor | InstructorOffice\n\nNow:\n\nNo redundant data\nAll anomalies removed\nDatabase is well-structured\nRubrics", "rubric_levels": "Excellent (2/3): Clearly explains normalization purpose; correctly identifies redundancy and all anomalies (insertion, deletion, update) with reasoning | Good (0.5-2):  Explains normalization and anomalies but misses depth or one type | Average (0.2-0.5):  Basic idea; anomalies unclear or partially incorrect | Poor (0-0.2):  No clear understanding; mostly incorrect"}, {"example_id": "147_c1", "criterion_index": 1, "criterion_name": "Explanation of normal forms(3)", "max_score": 3.0, "answer_id": 147, "image_file": "images/147.png", "question": "Question 1. In database systems, poor design can lead to data redundancy and update anomalies.", "model_answer": "Answer 1: Poor database design leads to data redundancy and update anomalies. Redundancy means storing the same data repeatedly, which increases storage and causes inconsistency. The main anomalies are:\n\nInsertion anomaly: Cannot insert data without adding unrelated information\nDeletion anomaly: Deleting a record may remove useful data\nUpdate anomaly: Same data must be updated in multiple rows\n\nNormalization is used to organize data and eliminate these problems.\n\nNormal Forms:\n\n1NF: Ensures atomic values and removes repeating groups\n2NF: Removes partial dependency (non-key depends on full primary key)\n3NF: Removes transitive dependency (non-key depends only on primary key)\n\nExample:\n\nUnnormalized Table:\nStudentID | Course | Instructor | InstructorPhone\n1 | DBMS | Rahim | 017XX\n1 | AI | Karim | 018XX\n\nProblems: Instructor data is repeated → redundancy and update anomaly.\n\nAfter Normalization:\n\nStudentCourse:\nStudentID | Course\n\nCourseInstructor:\nCourse | Instructor | InstructorPhone\n\nNow r  Forms:\n\n1NF: Removes repeating attributes\n2NF: Eliminates partial dependency\n3NF: Eliminates transitive dependency\n\nNormalized Tables:\n\nCustomer:\nCustomerID | Name | Address\n\nOrder:\nOrderID | CustomerID | Product\n\nNow each fact is stored once, reducing redundancy and eliminating anomalies.\nAnswer 3: Poor database design causes redundant data storage and anomalies (insertion, deletion, update), leading to inconsistency.\n\nNormalization is a step-by-step process to improve database structure.\n\nExample (Unnormalized Table):\nStudentID | StudentName | Course | Instructor | InstructorOffice\n\nProblems:\n\nInstructor details repeated → redundancy\nUpdate anomaly if instructor office changes\nStep 1: Convert to 1NF\n\nEnsure atomic values (already satisfied, no repeating groups)\n\nStep 2: Convert to 2NF\n\nRemove partial dependency:\n\nStudentName depends only on StudentID\n\nStudent Table:\nStudentID | StudentName\n\nStep 3: Convert to 3NF\n\nRemove transitive dependency:\n\nInstructorOffice depends on Instructor\n\nCourse Table:\nCourse | Instructor\n\nInstructor Table:\nInstructor | InstructorOffice\n\nNow:\n\nNo redundant data\nAll anomalies removed\nDatabase is well-structured\nRubrics", "rubric_levels": "Excellent (2/3): Clearly explains normalization purpose; correctly identifies redundancy and all anomalies (insertion, deletion, update) with reasoning | Good (0.5-2):  Explains normalization and anomalies but misses depth or one type | Average (0.2-0.5):  Basic idea; anomalies unclear or partially incorrect | Poor (0-0.2):  No clear understanding; mostly incorrect"}, {"example_id": "150_c1", "criterion_index": 1, "criterion_name": "Explanation of normal forms(3)", "max_score": 3.0, "answer_id": 150, "image_file": "images/150.png", "question": "Question 1. In database systems, poor design can lead to data redundancy and update anomalies.", "model_answer": "Answer 1: Poor database design leads to data redundancy and update anomalies. Redundancy me 2.0, "answer_id": 264, "image_file": "images/264.png", "question": "Q19: describe the 7 layers of OSI model (10 Marks)", "model_answer": "The OSI (Open Systems Interconnection) model is a conceptual framework that divides network communication into seven layers, each responsible for a specific function. This layered approach helps in understanding, designing, and troubleshooting network systems.\nOSI Model Diagram\n+---------------------+\n| 7. Application      |\n+---------------------+\n| 6. Presentation     |\n+---------------------+\n| 5. Session          |\n+---------------------+\n| 4. Transport        |\n+---------------------+\n| 3. Network          |\n+---------------------+\n| 2. Data Link        |\n+---------------------+\n| 1. Physical         |\n+---------------------+\n1. Physical Layer\nThe Physical layer is responsible for transmitting raw bits over a physical medium. It deals with hardware components such as cables, connectors, and electrical signals, ensuring that data is physically sent from one device to another.\n\n2. Data Link Layer\nThe Data Link layer ensures reliable communication between directly connected devices by organizing data into frames and performing error detection. It also uses MAC addresses to identify devices within the same network.\n\n3. Network Layer\nThe Network layer handles logical addressing and routing, determining the best path for data packets to travel from the source to the destination across multiple networks. Protocols such as IP operate at this layer.\n\n4. Transport Layer\nThe Transport layer provides reliable data transfer through segmentation, flow control, and error recovery. It uses protocols like TCP for reliable communication and UDP for faster, connectionless transmission.\n\n5. Session Layer\nThe Session layer is responsible for establishing, managing, and terminating communication sessions between applications. It maintains synchronization and controls the dialog during data exchange.\n\n6. Presentation Layer\nThe Presentation layer focuses on data representation by translating, encrypting, and compressing data so that it can be properly understood by the receiving system. Technologies such as SSL/TLS operate at this level.\n\n7. Application Layer\nThe Application layer is the topmost layer and provides network services directly to end users and applications. It enables interaction with the network through protocols such as HTTP, FTP, and SMTP.\nRubrics", "rubric_levels": "Excellent: All 7 layers listed in correct order (2.0) | Good: 5–6 correct, minor order issue (1.5) | Average: 3–4 correct (1.0) | Poor: ≤2 or incorrect (0–0.5)"}, {"example_id": "264_c1", "criterion_index": 1, "criterion_name": "Explanation of Layers with diagram (4 Marks)", "max_score": 4.0, "answer_id": 264, "image_file": "images/264.png", "question": "Q19: describe the 7 layers of OSI model (10 Marks)", "model_answer": "The OSI (Open Systems Interconnection) model is a conceptual framework that divides network communication into seven layers, each responsible for a specific function. This layered approach helps in understanding, designing, and troubleshooting network systems.\nOSI Model Diagram\n+---------------------+\n| 7. Application      |\n+---------------------+\n| 6. Presentation     |\n+---------------------+\n| 5. Session          |\n+---------------------+\n| 4. Transport        |\n+---------------------+\n| 3. Network          |\n+---------------------+\n| 2. Data Link        |\n+---------------------+\n| 1. Physical         |\n+---------------------+\n1. Physical Layer\nThe Physical layer is responsible for transmitting raw bits over a physical medium. It deals with hardware components such as cables, connectors, and electrical signals, ensuring that data is physically sent from one device to another.\n\n2. Data Link Layer\nThe Data Link layer ensures reliable communication between directly connected devices by organizing data into frames and performing error detection. It also us  the KDD (Knowledge Discovery in Databases) process and explain why data mining is essential in modern organizations.", "model_answer": "Definition of Data Mining:\nData mining is the process of discovering meaningful patterns, knowledge, or useful information from large datasets using techniques from statistics, machine learning, and pattern recognition.\nSteps of the KDD Process:\nThe Knowledge Discovery in Databases (KDD) process includes the following main steps:\n1. Data Selection\n2. Data Preprocessing / Cleaning\n3. Data Transformation\n4. Data Mining\n5. Pattern Evaluation\n6. Knowledge Presentation\nJustification / Importance of Data Mining:\nData mining is essential in modern organizations because it enables data-driven decision making and provides insights that would otherwise remain hidden in large datasets. By analyzing customer behavior, transaction patterns, and market trends, organizations can make strategic decisions that improve efficiency, increase revenue, and reduce risks.\n\nFor example, a retail company can analyze purchase histories to recommend products to customers, thereby increasing sales and enhancing customer satisfaction. Similarly, banks can detect fraudulent transactions by identifying unusual patterns in account activity, which helps prevent financial losses.\nRubrics for DataMining ", "rubric_levels": "Excellent (4): Clear and correct definition explaining discovery of useful patterns/knowledge from large datasets | Good (3): Correct definition but slightly incomplete | Average (2): Basic idea mentioned but not clearly defined | Poor (0-1): Incorrect or missing definition"}, {"example_id": "298_kdd", "criterion_index": 1, "criterion_name": "KDD Process Steps", "max_score": 4.0, "answer_id": 298, "image_file": "images/298.png", "question": "What is Data Mining? Describe the steps of the KDD (Knowledge Discovery in Databases) process and explain why data mining is essential in modern organizations.", "model_answer": "Definition of Da pendency (non-key depends on full primary key)\n3NF: Removes transitive dependency (non-key depends only on primary key)\n\nExample:\n\nUnnormalized Table:\nStudentID | Course | Instructor | InstructorPhone\n1 | DBMS | Rahim | 017XX\n1 | AI | Karim | 018XX\n\nProblems: Instructor data is repeated → redundancy and update anomaly.\n\nAfter Normalization:\n\nStudentCourse:\nStudentID | Course\n\nCourseInstructor:\nCourse | Instructor | InstructorPhone\n\nNow redundancy is minimized and anomalies are removed.\nAnswer 2:A poorly designed database suffers from redundancy and update anomalies, which reduce data consistency.\n\nSuppose we have a table:\nOrderID | CustomerName | CustomerAddress | Product\n\nIf a customer places multiple orders, their address is stored repeatedly → data redundancy.\n\nAnomalies:\n\nInsertion anomaly: Cannot add a new customer without an order\nDeletion anomaly: Deleting last order removes customer info\nUpdate anomaly: Changing address requires multiple updates\n\nTo solve this, we apply normalization.\n\nNormal Forms:\n\n1NF: Removes repeating attributes\n2NF: Eliminates partial dependency\n3NF: Eliminates transitive dependency\n\nNormalized Tables:\n\nCustomer:\nCustomerID | Name | Address\n\nOrder:\nOrderID | CustomerID | Product\n\nNow each fact is stored once, reducing redundancy and eliminating anomalies.\nAnswer 3: Poor database design causes redundant data storage and anomalies (insertion, deletion, update), leading to inconsistency.\n\nNormalization is a step-by-step process to improve database structure.\n\nExample (Unnormalized Table):\nStudentID | StudentName | Course | Instructor | InstructorOffice\n\nProblems:\n\nInstructor details repeated → redundancy\nUpdate anomaly if instructor office changes\nStep 1: Convert to 1NF\n\nEnsure atomic values (already satisfied, no repeating groups)\n\nStep 2: Convert to 2NF\n\nRemove partial dependency:\n\nStudentName depends only on StudentID\n\nStudent Table:\nStudentID | StudentName\n\nStep 3: Convert to 3NF\n\nRemove transitive dependency:\n\nInstructorOffice depends on Instructor\n\nCourse Table:\nCourse | Instructor\n\nInstructor Table:\nInstructor | InstructorOffice\n\nNow:\n\nNo redundant data\nAll anomalies removed\nDatabase is well-structured\nRubrics", "rubric_levels": "Excellent (2/3): Clearly explains normalization purpose; correctly identifies redundancy and all anomalies (insertion, deletion, update) with reasoning | Good (0.5-2):  Explains normalization and anomalies but misses depth or one type | Average (0.2-0.5):  Basic idea; anomalies unclear or partially incorrect | Poor (0-0.2):  No clear understanding; mostly incorrect"}, {"example_id": "146_c1", "criterion_index": 1, "criterion_name": "Explanation of normal forms(3)", "max_score": 3.0, "answer_id": 146, "image_file": "images/146.png", "question": "Question 1. In database systems, poor design can lead to data redundancy and update anomalies.", "model_answer": "Answer 1: Poor database design leads to data redundancy and update anomalies. Redundancy means storing the same data repeatedly, which increases storage and causes inconsistency. The main anomalies are:\n\nInsertion anomaly: Cannot insert data without adding unrelated information\nDeletion anomaly: Deleting a record may remove useful data\nUpdate anomaly: Same data must be updated in multiple rows\n\nNormalization is used to organize data and eliminate these problems.\n\nNormal Forms:\n\n1NF: Ensures atomic values and removes repeating groups\n2NF: Removes partial dependency (non-key depends on full primary key)\n3NF: Removes transitive dependency (non-key depends only on primary key)\n\nExample:\n\nUnnormalized Table:\nStudentID | Course | Instructor | InstructorPhone\n1 | DBMS | Rahim | 017XX\n1 | AI | Karim | 018XX\n\nProblems: Instructor data is repeated → redundancy and update anomaly.\n\nAfter Normalization:\n\nStudentCourse:\nStudentID | Course\n\nCourseInstructor:\nCourse | Instructor | InstructorPhone\n\nNow redunda chine Learning.", "model_answer": "Supervised Learning:\nSupervised learning is a type of machine learning in which the model is trained using labeled data. Each input is associated with a correct output, and the model learns to map inputs to outputs by minimizing error using a loss function.\nExamples include spam detection, image classification, and regression tasks.\nUnsupervised Learning:\nUnsupervised learning is a type of machine learning where the model is trained on unlabeled data. It identifies hidden patterns, structures, or relationships within the data.\nCommon techniques include clustering and dimensionality reduction.\nExamples include customer segmentation and anomaly detection.\nReinforcement Learning:\nReinforcement learning is a type of machine learning where an agent interacts with an environment and learns by receiving rewards or penalties. The objective is to learn an optimal policy that maximizes cumulative reward over time.\nExamples include game playing, robotics, and self-driving systems.\nRubrics for Machine Learning", "rubric_levels": "Excellent (2.5): Defines clearly AND includes key idea (labeled data + prediction/learning) AND example | Good (2): Correct definition but missing either key idea or example | Average (1.5): Partial understanding (only labeled data mentioned) | Poor (1): Incorrect or missing definition"}, {"example_id": "422_c1", "criterion_index": 1, "criterion_name": "Unsupervised Learning", "max_score": 2.5, "answer_id": 422, "image_file": "images/422.png", "question": "Describe Supervised, Unsupervised, and Reinforcement Machine Learning.", "model_answer": "Supervised Learning:\nSupervised learning is a type of machine learning in which the model is trained using labeled data. Each input is associated with a correct output, and the model learns to map inputs to outputs by minimizing error using a loss function.\nExamples include spam detection, image classification, and regression tasks.\nUnsupervised Learning:\nUnsupervised learning is a type of machine learning where the model is trained on unlabeled data. It identifies hidden patterns, structures, or relationships within the data.\nCommon techniques include clustering and dimensionality reduction.\nExamples include customer segmentation and anomaly detection.\nReinforcement Learning:\nReinforcement learning is a type of machine learning where an agent interacts with an environment and learns by receiving rewards or penalties. The objective is to learn an optimal policy that maximizes cumulative reward over time.\nExamples include game playing, robotics, and self-driving systems.\nRubrics for Machine Learning", "rubric_levels": "Excellent (2.5): Clearly states no labels AND mentions pattern discovery (e.g., clustering) with example | Good (2): Correct but lacks example or clarity | Average (1.5): Mentions no labels but no understanding of purpose | Poor (1): Incorrect or missing definition"}, {"example_id": "422_c2", "criterion_index": 2, "criterion_name": "Reinforcement Learning", "max_score": 2.5, "answer_id": 422, "image_file": "images/422.png", "question": "Describe Supervised, Unsupervised, and Reinforcement Machine Learning.", "model_answer": "Supervised Learning:\nSupervised learning is a type of machine learning in which the model is trained using labeled data. Each input is associated with a correct output, and the model learns to map inputs to outputs by minimizing error using a loss function.\nExamples include spam detection, image classification, and regression tasks.\nUnsupervised Learning:\nUnsupervised learning is a type of machine learning where the model is trained on unlabeled data. It identifies hidden patterns, structures, or relationships within the data.\nCommon techniques include clustering and dimensionality reduction.\nExamples include customer segmentation and anomaly detection.\nReinforcement Learning:\nReinforcement learning is a type of machine learning where an agent interacts with an environment and
