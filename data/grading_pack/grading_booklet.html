ng of concepts | Poor (1): Poor or unclear explanation"}, {"example_id": "177_c0", "criterion_index": 0, "criterion_name": "Understanding of normalization and related problems(3)", "max_score": 3.0, "answer_id": 177, "image_file": "images/177.png", "question": "Question 1. In database systems, poor design can lead to data redundancy and update anomalies.", "model_answer": "Answer 1: Poor database design leads to data redundancy and update anomalies. Redundancy means storing the same data repeatedly, which increases storage and causes inconsistency. The main anomalies are:\n\nInsertion anomaly: Cannot insert data without adding unrelated information\nDeletion anomaly: Deleting a record may remove useful data\nUpdate anomaly: Same data must be updated in multiple rows\n\nNormalization is used to organize data and eliminate these problems.\n\nNormal Forms:\n\n1NF: Ensures atomic values and removes repeating groups\n2NF: Removes partial dependency (non-key depends on full primary key)\n3NF: Removes transitive dependency (non-key depends only on primary key)\n\nExample:\n\nUnnormalized Table:\nStudentID | Course | Instructor | InstructorPhone\n1 | DBMS | Rahim | 017XX\n1 | AI | Karim | 018XX\n\nProblems: Instructor data is repeated → redundancy and update anomaly.\n\nAfter Normalization:\n\nStudentCourse:\nStudentID | Course\n\nCourseInstructor:\nCourse | Instructor | InstructorPhone\n\nNow redundancy is minimized and anomalies are removed.\nAnswer 2:A poorly designed database suffers from redundancy and update anomalies, which reduce data consistency.\n\nSuppose we have a table:\nOrderID | CustomerName | CustomerAddress | Product\n\nIf a customer places multiple orders, their address is stored repeatedly → data redundancy.\n\nAnomalies:\n\nInsertion anomaly: Cannot add a new customer without an order\nDeletion anomaly: Deleting last order removes customer info\nUpdate anomaly: Changing address requires multiple updates\n\nTo solve this, we apply normalization.\n\nNormal Forms:\n\n1NF: Removes repeating attributes\n2NF: Eliminates partial dependency\n3NF: Eliminates transitive dependency\n\nNormalized Tables:\n\nCustomer:\nCustomerID | Name | Address\n\nOrder:\nOrderID | CustomerID | Product\n\nNow each fact is stored once, reducing redundancy and eliminating anomalies.\nAnswer 3: Poor database design causes redundant data storage and anomalies (insertion, deletion, update), leading to inconsistency.\n\nNormalization is a step-by-step process to improve database structure.\n\nExample (Unnormalized Table):\nStudentID | StudentName | Course | Instructor | InstructorOffice\n\nProblems:\n\nInstructor details repeated → redundancy\nUpdate anomaly if instructor office changes\nStep 1: Convert to 1NF\n\nEnsure atomic values (already satisfied, no repeating groups)\n\nStep 2: Convert to 2NF\n\nRemove partial dependency:\n\nStudentName depends only on StudentID\n\nStudent Table:\nStudentID | StudentName\n\nStep 3: Convert to 3NF\n\nRemove transitive dependency:\n\nInstructorOffice depends on Instructor\n\nCourse Table:\nCourse | Instructor\n\nInstructor Table:\nInstructor | InstructorOffice\n\nNow:\n\nNo redundant data\nAll anomalies removed\nDatabase is well-structured\nRubrics", "rubric_levels": "Excellent (2/3): Clearly explains normalization purpose; correctly identifies redundancy and all anomalies (insertion, deletion, update) with reasoning | Good (0.5-2):  Explains normalization and anomalies but misses depth or one type | Average (0.2-0.5):  Basic idea; anomalies unclear or partially incorrect | Poor (0-0.2):  No clear understanding; mostly incorrect"}, {"example_id": "177_c1", "criterion_index": 1, "criterion_name": "Explanation of normal forms(3)", "max_score": 3.0, "answer_id": 177, "image_file": "images/177.png", "question": "Question 1. In database systems, poor design can lead to data redundancy and update anomalies.", "model_answer": "Answer 1: Poor database design leads to data redundancy and update anomalies. Redundancy me swer_id": 316, "image_file": "images/316.png", "question": "What is Data Mining? Describe the steps of the KDD (Knowledge Discovery in Databases) process and explain why data mining is essential in modern organizations.", "model_answer": "Definition of Data Mining:\nData mining is the process of discovering meaningful patterns, knowledge, or useful information from large datasets using techniques from statistics, machine learning, and pattern recognition.\nSteps of the KDD Process:\nThe Knowledge Discovery in Databases (KDD) process includes the following main steps:\n1. Data Selection\n2. Data Preprocessing / Cleaning\n3. Data Transformation\n4. Data Mining\n5. Pattern Evaluation\n6. Knowledge Presentation\nJustification / Importance of Data Mining:\nData mining is essential in modern organizations because it enables data-driven decision making and provides insights that would otherwise remain hidden in large datasets. By analyzing customer behavior, transaction patterns, and market trends, organizations can make strategic decisions that improve efficiency, increase revenue, and reduce risks.\n\nFor example, a retail company can analyze purchase histories to recommend products to customers, thereby increasing sales and enhancing customer satisfaction. Similarly, banks can detect fraudulent transactions by identifying unusual patterns in account activity, which helps prevent financial losses.\nRubrics for DataMining ", "rubric_levels": "Excellent (4): Clear and correct definition explaining discovery of useful patterns/knowledge from large datasets | Good (3): Correct definition but slightly incomplete | Average (2): Basic idea mentioned but not clearly defined | Poor (0-1): Incorrect or missing definition"}, {"example_id": "316_kdd", "criterion_index": 1, "criterion_name": "KDD Process Steps", "max_score": 4.0, "answer_id": 316, "image_file": "images/316.png", "question": "What is Data Mining? Describe the steps of the KDD (Knowledge Discovery in Databases) process onships. It is stable and does not change frequently.\nAn instance is the actual data stored in the database at a specific moment in time.\n\nExample:\nSchema: Student(SID, Name, Email, Phone)\nInstance: (1, Rahim, rahim@gmail.com\n, 017xxx)\n\nTypes of Keys\nSuper Key: Any set of attributes that uniquely identifies a record.\nExample: {SID}, {Email}, {SID, Name}\nCandidate Key: Minimal super key (no redundant attribute).\nExample: {SID}, {Email}\nPrimary Key: Selected candidate key used to uniquely identify records.\nExample: SID\nUnique Key: Ensures uniqueness but may allow NULL values.\nExample: Email\nComposite Key: A key made using more than one attribute.\nExample: (SID, Phone) in some cases\nGiven Relation: Student(SID, Name, Email, Phone)\nCandidate Keys: SID, Email (both are unique)\nSuper Keys: Any combination containing SID or Email\nExample: {SID}, {Email}, {SID, Name}, {Email, Phone}\nPrimary Key: SID (assumed)\nUnique Key: Email\nComposite Key: Not required here since single attributes are already unique\n\nAnswer 2: Schema vs Instance\n\nSchema defines the structure of a database (tables, attributes, constraints). It is like a blueprint.\nInstance is the actual data stored in the database at a specific time.\n\nExample:\nSchema: Student(SID, Name, Email, Phone)\nInstance: (101, Karim, karim@gmail.com\n, 018xxx)\n\nTypes of Keys\nSuper Key: A set of attributes that can uniquely identify a tuple.\nExample: SID or (SID, Name)\nCandidate Key: A minimal version of super key with no extra attribute.\nExample: SID, Email\nPrimary Key: Chosen candidate key for identification.\nExample: SID\nUnique Key: Ensures all values are unique (can be multiple per table).\nExample: Email\nComposite Key: A key formed by combining multiple attributes.\nExample: (SID, Name) if needed\nKeys in Given Relation\n\nStudent(SID, Name, Email, Phone)\n\nSID → unique → candidate key\nEmail → unique → candidate key\nName → not unique\nPhone → not unique\n\n✔ Candidate Keys: SID, Emai const SHEET_NAME = "grading_sheet.xlsx";
const STORE_KEY = "obe_grading_booklet_test";

let handle = null;          // FileSystemFileHandle for grading_sheet.xlsx
let fileRecords = null;     // every record read from that file (all raters)
let fileColumns = COLUMNS;  // its header order, preserved on write
let saveTimer = null;

/* ---------- helpers ---------- */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s)
  .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
  .replace(/"/g, "&quot;");
const clean = (v) => String(v == null ? "" : v).trim();
const teacherId = () => clean($("teacher").value) || "rater2";

function say(message, ms) {
  const box = $("notice");
  box.textContent = message;
  box.style.display = message ? "block" : "none";
  if (ms) setTimeout(() => { box.style.display = "none"; }, ms);
}

function status(text, state) {
  const chip = $("link");
  chip.textContent = text;
  chip.className = state;
}

/* ---------- render ---------- */
function render() {
  const byAnswer = new Map();
  for (const row of ROWS) {
    if (!byAnswer.has(row.answer_id)) byAnswer.set(row.answer_id, []);
    byAnswer.get(row.answer_id).push(row);
  }
  const parts = [];
  for (const [answerId, group] of byAnswer) {
    const first = group[0];
    parts.push("<div class='answer'>");
    parts.push("<h2>Answer " + esc(answerId) + "</h2>");
    parts.push("<div class='q'><b>Question:</b> " + esc(first.question) + "</div>");
    parts.push("<div class='q'><b>Reference answer:</b> " +
               esc(first.model_answer) + "</div>");
    parts.push("<img src='" + esc(first.image_file) + "' alt='student answer'>");
    parts.push("<table><tr><th style='width:90px'>ID</th><th>Criterion</th>" +
               "<th>Rubric levels</th><th style='width:60px'>Max</th>" +
               "<th style='width:120px'>Your mark</th></tr>");
    for (const row of group) {
      parts.push("<tr><td>" + esc(row.example_id) + "</td>" +
        "<td>" + esc(row.criterion_name) + "</td>" +
        "<td>" + esc(row.rubric_levels) + "</td>" +
        "<td>" + esc(row.max_score) + "</td>" +
        "<td class='mark'><input class='mark' type='number' step='0.05' min='0' " +
        "max='" + esc(row.max_score) + "' data-id='" + esc(row.example_id) + "' " +
        "data-max='" + esc(row.max_score) + "'>" +
        "<span class='max'>/ " + esc(row.max_score) + "</span></td></tr>");
    }
    parts.push("</table></div>");
  }
  $("answers").innerHTML = parts.join("\n");
  for (const img of document.querySelectorAll("#answers img")) {
    img.addEventListener("error", () => {
      const note = document.createElement("div");
      note.className = "q";
      note.textContent = "Image not found: " + img.getAttribute("src") +
        " — keep this page next to the images folder.";
      img.replaceWith(note);
    });
  }
}

/* ---------- marks ---------- */
function inputs() { return Array.from(document.querySelectorAll("input.mark")); }

function check(box) {
  const raw = clean(box.value);
  box.classList.remove("filled", "bad");
  if (raw === "") return true;
  const value = Number(raw), max = Number(box.dataset.max);
  const good = Number.isFinite(value) && value >= 0 &&
               (!Number.isFinite(max) || value <= max);
  box.classList.add(good ? "filled" : "bad");
  return good;
}

function refresh() {
  const boxes = inputs();
  let filled = 0, bad = 0;
  for (const box of boxes) {
    if (!check(box)) bad++;
    if (clean(box.value) !== "") filled++;
  }
  $("progress").textContent = filled + " / " + boxes.length + " filled" +
    (bad ? "  —  " + bad + " out of range" : "");
  $("progress").style.color = bad ? "#c02626" : "#5c6472";
}

function collect() {
  const scores = {};
  for (const box of inputs()) {
    const raw = clean(box.value);
    if (raw !== "") scores[box.dataset.id] = raw;
  }
  return scores;
}

function apply(scores) {
  let hits = 0;
  for (const box of inputs()) {
    const value = scores[box.dataset.id];
    if (value !== undefined && clean(value) !== "" &&
        clean(value).toLowerCase() !== "nan") {
      box.value = clean(value);
      hits++;
    }
  }
  refresh();
  return hits;
}

function localSave() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(
      { teacher: $("teacher").value, scores: collect() }));
  } catch (error) { /* file:// or private mode */ }
}

function localLoad() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
    if (!saved) return 0;
    if (saved.teacher && !clean($("teacher").value)) {
      $("teacher").value = saved.teacher;
    }
    return apply(saved.scores || {});
  } catch (error) { return 0; }
}

/* ---------- sheet records <-> page ---------- */
function scoresOf(records, rater) {
  const scores = {};
  for (const record of records) {
    if (rater != null && clean(record.rater_id) !== rater) continue;
    const value = clean(record.score);
    if (value !== "" && value.toLowerCase() !== "nan") {
      scores[clean(record.example_id)] = value;
    }
  }
  return scores;
}

function loadRecords(records, source) {
  fileRecords = records;
  const raters = [...new Set(records.map((r) => clean(r.rater_id)))].filter(Boolean);
  const typed = clean($("teacher").value);
  const rater = typed && raters.includes(typed) ? typed
              : (raters.find((r) => Object.keys(scoresOf(records, r)).length) ||
                 raters[0] || "");
  if (rater && !typed) $("teacher").value = rater;
  const hits = apply(scoresOf(records, rater || null));
  if (hits) {
    say("Loaded " + hits + " mark(s) for “" + (rater || teacherId()) +
        "” from " + source + ".", 8000);
  }
  return hits;
}

/* Merge the page's marks into the file's records, keeping other raters. */
function mergedRecords() {
  const scores = collect();
  const rater = teacherId();
  const base = (fileRecords || []).map((record) => {
    const copy = {};
    for (const column of fileColumns) copy[column] = record[column] ?? "";
    return copy;
  });
  const mine = new Map();
  for (const record of base) {
    if (clean(record.rater_id) === rater) mine.set(clean(record.example_id), record);
  }
  const extra = [];
  for (const row of ROWS) {
    const id = clean(row.example_id);
    const value = scores[id] ?? "";
    const target = mine.get(id);
    if (target) { target.score = value; continue; }
    const fresh = {};
    for (const column of fileColumns) fresh[column] = row[column] ?? "";
    fresh.rater_id = rater;
    fresh.score = value;
    extra.push(fresh);
  }
  return base.concat(extra);
}

function blankRecords() {
  return ROWS.map((row) => {
    const record = {};
    for (const column of COLUMNS) record[column] = row[column] ?? "";
    record.rater_id = teacherId();
    record.score = "";
    return record;
  });
}

/* ---------- file access ---------- */
const canWriteFiles = typeof window.showOpenFilePicker === "function";

function toWorkbook(records) {
  const sheet = XLSX.utils.json_to_sheet(records, { header: fileColumns });
  const book = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(book, sheet, "grading_sheet");
  return book;
}

function parseCsv(text) {
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const rows = [];
  let field = "", row = [], quoted = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (quoted) {
      if (ch === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else quoted = false; }
      else field += ch;
    } else if (ch === '"') quoted = true;
    else if (ch === ",") { row.push(field); field = ""; }
    else if (ch === "\n") { row.push(field); rows.push(row); row = []; field = ""; }
    else if (ch !== "\r") field += ch;
  }
  if (field !== "" || row.length) { row.push(field); rows.push(row); }
  if (!rows.length) return [];
  const header = rows.shift().map((h) => h.trim());
  fileColumns = header.length ? header : COLUMNS;
  return rows.filter((r) => r.length > 1).map((r) => {
    const object = {};
    header.forEach((name, i) => { object[name] = r[i] ?? ""; });
    return object;
  });
}

function parseWorkbook(buffer) {
  const book = XLSX.read(new Uint8Array(buffer), { type: "array" });
  const sheet = book.Sheets[book.SheetNames[0]];
  const header = XLSX.utils.sheet_to_json(sheet, { header: 1, range: 0 })[0];
  if (Array.isArray(header) && header.length) fileColumns = header.map(String);
  return XLSX.utils.sheet_to_json(sheet, { defval: "", raw: false });
}

async function readHandle(source) {
  const file = await handle.getFile();
  const csv = /\.csv$/i.test(file.name);
  const records = csv ? parseCsv(await file.text())
                      : parseWorkbook(await file.arrayBuffer());
  loadRecords(records, source || file.name);
}

async function writeHandle() {
  if (!handle) return;
  status("Excel: saving…", "off");
  const records = mergedRecords();
  let data;
  if (/\.csv$/i.test(handle.name)) {
    const quote = (v) => {
      const text = String(v == null ? "" : v);
      return /[",\n\r]/.test(text) ? '"' + text.replace(/"/g, '""') + '"' : text;
    };
    const lines = [fileColumns.join(",")];
    for (const record of records) {
      lines.push(fileColumns.map((c) => quote(record[c])).join(","));
    }
    data = new Blob(["﻿" + lines.join("\r\n")], { type: "text/csv" });
  } else {
    data = new Blob([XLSX.write(toWorkbook(records),
      { bookType: "xlsx", type: "array" })], { type: "application/octet-stream" });
  }
  const writable = await handle.createWritable();
  await writable.write(data);
  await writable.close();
  fileRecords = records;
  const now = new Date().toLocaleTimeString();
  status("Excel: " + handle.name + " ✓ saved " + now, "on");
}

function queueSave() {
  localSave();
  if (!handle) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    writeHandle().catch((error) => {
      status("Excel: not connected — click to reconnect", "off");
      say("Could not write the sheet: " + error.message, 9000);
      handle = null;
    });
  }, 600);
}

/* Remember the handle so later sessions reconnect without a file picker. */
function idb(mode, value) {
  return new Promise((resolve) => {
    let request;
    try { request = indexedDB.open("obe_booklet", 1); }
    catch (error) { return resolve(null); }
    request.onupgradeneeded = () => request.result.createObjectStore("handles");
    request.onerror = () => resolve(null);
    request.onsuccess = () => {
      const db = request.result;
      let store;
      try { store = db.transaction("handles", mode).objectStore("handles"); }
      catch (error) { return resolve(null); }
      const op = mode === "readwrite" ? store.put(value, STORE_KEY)
                                      : store.get(STORE_KEY);
      op.onsuccess = () => resolve(op.result ?? null);
      op.onerror = () => resolve(null);
    };
  });
}

async function connect(interactive) {
  if (!canWriteFiles) {
    status("Excel: this browser cannot save to files — use Chrome or Edge",
           "off");
    $("dl").style.display = "inline-block";
    return;
  }
  try {
    if (!handle && interactive) {
      [handle] = await window.showOpenFilePicker({
        id: "obeGradingPack",
        types: [{ description: "Grading sheet",
                  accept: { "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet": [".xlsx"],
                            "text/csv": [".csv"] } }],
      });
      await idb("readwrite", handle);
    }
    if (!handle) return;
    let permission = await handle.queryPermission({ mode: "readwrite" });
    if (permission !== "granted" && interactive) {
      permission = await handle.requestPermission({ mode: "readwrite" });
    }
    if (permission !== "granted") {
      status("Excel: click to connect " + SHEET_NAME, "off");
      handle = null;
      return;
    }
    await readHandle();
    status("Excel: " + handle.name + " ✓ connected", "on");
    if (Object.keys(collect()).length) queueSave();
  } catch (error) {
    handle = null;
    status("Excel: click to connect " + SHEET_NAME, "off");
    if (interactive && error.name !== "AbortError") {
      say("Could not open the sheet: " + error.message, 9000);
    }
  }
}

/* Auto-load on open: remembered handle first, then a plain fetch (works when
   the folder is served over http://), then the in-browser copy. */
async function boot() {
  render();
  refresh();

  const remembered = await idb("readonly");
  if (remembered) {
    handle = remembered;
    await connect(false);
  }
  if (!handle) {
    try {
      const response = await fetch(SHEET_NAME, { cache: "no-store" });
      if (response.ok) {
        fileRecords = parseWorkbook(await response.arrayBuffer());
        loadRecords(fileRecords, SHEET_NAME);
        status("Excel: loaded — click to enable auto-save", "off");
      }
    } catch (error) { /* file:// blocks this; the picker covers it */ }
  }
  if (!fileRecords) fileRecords = blankRecords();
  if (!handle) {
    localLoad();
    if (!canWriteFiles) {
      status("Excel: this browser cannot save to files — use Chrome or Edge",
             "off");
      $("dl").style.display = "inline-block";
    } else if (!$("link").classList.contains("on")) {
      status("Excel: click to connect " + SHEET_NAME, "off");
    }
  }
}

/* ---------- wiring ---------- */
$("answers").addEventListener("input", (event) => {
  if (!event.target.classList.contains("mark")) return;
  refresh();
  queueSave();
});
$("answers").addEventListener("keydown", (event) => {
  if (event.key !== "Enter" || !event.target.classList.contains("mark")) return;
  event.preventDefault();
  const all = inputs();
  const next = all[all.indexOf(event.target) + 1];
  if (next) { next.focus(); next.select(); }
});
$("teacher").addEventListener("change", () => {
  if (fileRecords && !Object.keys(collect()).length) {
    apply(scoresOf(fileRecords, teacherId()));
  }
  queueSave();
});
$("link").addEventListener("click", () => connect(true));
$("dl").addEventListener("click", () => {
  const blob = new Blob([XLSX.write(toWorkbook(mergedRecords()),
    { bookType: "xlsx", type: "array" })], { type: "application/octet-stream" });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = SHEET_NAME;
  link.click();
  URL.revokeObjectURL(link.href);
});
window.addEventListener("beforeunload", (event) => {
  if (!handle && Object.keys(collect()).length) {
    event.preventDefault();
    event.returnValue = "";
  }
});

boot();
</script>

</html>
