<style>

                     border-radius:4px; font-size:14px; width:150px; }
  #link { border:1px solid var(--line); background:#fff; border-radius:14px;
          padding:5px 12px; font-size:12.5px; cursor:pointer; color:var(--ink); }
  #link:hover { background:#eef1f6; }
  #link.on { border-color:#a8d8b9; background:#f2fbf5; color:var(--ok);
             cursor:default; }
  #link.off { border-color:#e6d79a; background:#fff6d8; }
  #dl { display:none; padding:6px 11px; border:1px solid var(--line);
        border-radius:4px; background:#fff; font-size:12.5px; cursor:pointer; }

  #notice { padding:8px 20px; font-size:13px; background:#fff6d8;
            border-bottom:1px solid #e6d79a; display:none; }
  main { padding:20px; max-width:1100px; margin:0 auto; }
  .intro { background:#fff; border:1px solid var(--line); border-radius:6px;
           padding:12px 16px; margin-bottom:18px; font-size:13.5px;
           color:var(--muted); }
  .answer { background:#fff; border:1px solid var(--line); border-radius:6px;
            padding:18px; margin-bottom:22px; page-break-after:always; }
  .answer h2 { margin:0 0 10px; font-size:18px; }
  .q { background:#f7f8fa; border-left:4px solid #98a2b3; padding:9px 12px;
       margin:8px 0; white-space:pre-wrap; font-size:14px; }
  img { max-width:100%; border:1px solid var(--line); border-radius:4px;
        margin-top:8px; }
  table { border-collapse:collapse; width:100%; margin-top:14px; }
  th, td { border:1px solid var(--line); padding:7px 8px; font-size:13.5px;
           vertical-align:top; text-align:left; }
  th { background:#f0f2f5; }
  td.mark { text-align:center; white-space:nowrap; }

ood (1.75): Mentions the altered parameters properly, but does not mention the reasons | Average (1.25-1.5):  Mention 1 or 2  parameters properly and does not explain the cause also | Poor (=<1): Mention incomplete and irrelevant data"}, {"example_id": "343_c0", "criterion_index": 0, "criterion_name": "Understanding of Concept", "max_score": 4.0, "answer_id": 343, "image_file": "images/343.png", "question": "Question 1. You are given the following values: 12, -5.4, 10000, 3.14, 0, 87, -200, 45.6, 999, 1.2. Choose the most efficient among Counting Sort, Radix Sort, or Bucket Sort for this dataset. Justify your selection and state the time and space complexity of all three algorithms.\n2. A directed weighted graph is given below. Determine whether the graph contains a negative cycle using a step-by-step solution. Graph (text form): Vertices = {A, B, C, D}; Edges = A→B (4), B→C (-6), C→D (2), D→B (1), A→D (5).\n3. You are given coin denominations: 1, 3, 4, 5. Find the minimum number of coins required to make 10 taka. Show the DP table and derive the final answer.", "model_answer": "Answer 1: Bucket Sort is the most efficient for this dataset because it contains floating-point numbers and a wide range of values including negatives. Counting Sort is not suitable due to large range and non-integers, and Radix Sort is inefficient for floating-point values. Time Complexity: Counting Sort = O(n + k), Space = O(k); Radix Sort = O(d(n + k)), Space = O(n + k); Bucket Sort = O(n + k) average, worst O(n²), Space = O(n + k). Therefore, Bucket Sort is preferred.\nAnswer 2: Using Bellman-Ford algorithm: Step 1 initialize distances (A=0, others=∞). Step 2 relax edges repeatedly: A→B (4), B→C (-6), C→D (2), D→B (1). After V-1 iterations, distances keep decreasing due to cycle B→C→D→B with total weight (-6 + 2 + 1 = -3). Step 3 one more relaxation still reduces distance, confirming a negative cycle exists. Therefore, the graph contains a negative cycle.\nAnswer 3: Using Dynamic Program aking features more distinguishable.\nImproved Image Interpretation: Useful in applications like medical imaging (e.g., X-rays, MRI), remote sensing, and surveillance systems.\nPreprocessing Step: Helps improve the performance of further image processing tasks such as segmentation and feature extraction.\nDefinition of Histogram Matching\n\nHistogram Matching (also called histogram specification) is a technique where the histogram of an input image is transformed to match the histogram of a reference image.\nNecessity of Histogram Matching\nHistogram matching is important due to the following reasons:\nConsistency Across Images: Ensures uniform appearance between multiple images.\nHandling Lighting Variations: Useful when images are captured under different lighting conditions.\nImproved Comparison: Makes image comparison more reliable by normalizing intensity distributions.\nBetter Performance in ML Systems: Enhances accuracy in image recognition and machine learning models.\nImage Normalization: Helps in standardizing datasets for analysis.\nRubrics for Digital Image Processing", "rubric_levels": "Excellent (4): Clearly defines and explains redistribution of intensity values with purpose of contrast enhancement | Good (3): Correct but missing one key aspect | Average (2): Basic idea present but unclear | Poor (1): Incorrect or missing definition"}, {"example_id": "99_c1", "criterion_index": 1, "criterion_name": "Necessity of Histogram Equalization", "max_score": 4.0, "answer_id": 99, "image_file": "images/99.png", "question": "Question Q9: Explain necessity of histogram equalization and histogram matching in Image Processing. (10 Marks)", "model_answer": "Definition of Histogram Equalization\n\nHistogram Equalization is a technique used in image processing to enhance the contrast of an image by redistributing its intensity values so that they are spread more uniformly across the entire range.\nNecessity of Histogram Equalization\n\nHistogram equalization is necess d (3): Some correct points but incomplete | Average (2): Limited explanation | Poor (1): Incorrect or irrelevant explanation"}, {"example_id": "189_c0", "criterion_index": 0, "criterion_name": "Understanding of schema and instance (2)", "max_score": 2.0, "answer_id": 189, "image_file": "images/189.png", "question": "Define schema and instance in a database system.\n\nThen, explain the following types of keys with suitable examples:\n- Super Key\n- Candidate Key\n- Primary Key\n- Unique Key\n- Composite Key\n\nFinally, consider the relation:\nStudent(SID, Name, Email, Phone)\n\nAssume:\n- Each student has a unique SID\n- Email is also unique\n- Multiple students may have the same name\n\nIdentify all possible keys for this relation and briefly justify your answer.", "model_answer": "Answer 1: Schema and Instance\n\nA schema is the logical structure of a database that defines tables, attributes, and relationships. It is stable and does not change frequently.\nAn instance is the actual data stored in the database at a specific moment in time.\n\nExample:\nSchema: Student(SID, Name, Email, Phone)\nInstance: (1, Rahim, rahim@gmail.com\n, 017xxx)\n\nTypes of Keys\nSuper Key: Any set of attributes that uniquely identifies a record.\nExample: {SID}, {Email}, {SID, Name}\nCandidate Key: Minimal super key (no redundant attribute).\nExample: {SID}, {Email}\nPrimary Key: Selected candidate key used to uniquely identify records.\nExample: SID\nUnique Key: Ensures uniqueness but may allow NULL values.\nExample: Email\nComposite Key: A key made using more than one attribute.\nExample: (SID, Phone) in some cases\nGiven Relation: Student(SID, Name, Email, Phone)\nCandidate Keys: SID, Email (both are unique)\nSuper Keys: Any combination containing SID or Email\nExample: {SID}, {Email}, {SID, Name}, {Email, Phone}\nPrimary Key: SID (assumed)\nUnique Key: Email\nComposite Key: Not required here since single attributes are already unique\n\nAnswer 2: Schema vs Instance\n\nSchema defines the structure of a database (tables, attributes, constraints). It is like a blueprint.\nInstance is the actual data stored in the database at a specific time.\n\nExample:\nSchema: Student(SID, Name, Email, Phone)\nInstance: (101, Karim, karim@gmail.com\n, 018xxx)\n\nTypes of Keys\nSuper Key: A set of attributes that can uniquely identify a tuple.\nExample: SID or (SID, Name)\nCandidate Key: A minimal version of super key with no extra attribute.\nExample: SID, Email\nPrimary Key: Chosen candidate key for identification.\nExample: SID\nUnique Key: Ensures all values are unique (can be multiple per table).\nExample: Email\nComposite Key: A key formed by combining multiple attributes.\nExample: (SID, Name) if needed\nKeys in Given Relation\n\nStudent(SID, Name, Email, Phone)\n\nSID → unique → candidate key\nEmail → unique → candidate key\nName → not unique\nPhone → not unique\n\n✔ Candidate Keys: SID, Email\n✔ Primary Key: SID\n✔ Super Keys: Any set containing SID or Email\n✔ Unique Key: Email\nAnswer 3: Schema and Instance\n\nA schema represents the structure of the database including table design and attributes.\nAn instance represents the current set of data stored in the database.\n\nExample:\nSchema: Student(SID, Name, Email, Phone)\nInstance: (201, Hasan, hasan@gmail.com\n, 017xxx)\n\nTypes of Keys\nSuper Key: Any attribute or combination that uniquely identifies a row.\nExample: SID, Email, (SID, Phone)\nCandidate Key: A minimal super key used for unique identification.\nExample: SID, Email\nPrimary Key: Selected candidate key to uniquely identify records.\nExample: SID\nUnique Key: Ensures uniqueness of values; multiple allowed per table.\nExample: Email\nComposite Key: Combination of multiple attributes used as a key.\nExample: (SID, Name)\nKey Identification in Student Relation\n\nStudent(SID, Name, Email, Phone)\n\nSID is unique → Candidate Key\nEmail is unique → Candidate Key\nName is not unique\nPhone is not unique\n\n✔ Candidate Keys: SID, Email\n✔ Primary Key: SID (chosen)\n✔ Super Keys: SID, Email, and their combinations\n✔ Unique Key: Email\n✔ Composite Key: Not necessary in this relation\nRubrics", "rubric_levels": "Excellent (2-4): Clearly defines schema and instance with correct distinction and suitable example | Good(1-3):  Mostly correct definitions with minor confusion or weak example | Average (0.5-1):  Basic idea but unclear or partially incorrect | Poor(0-0.3):  Incorrect or missing understanding"}, {"example_id": "189_c1", "criterion_index": 1, "criterion_name": "Explanation of different types of keys with examples (4)", "max_score": 4.0, "answer_id": 189, "image_file": "images/189.png", "question": "Define schema and instance in a database system.\n\nThen, explain the following types of keys with suitable examples:\n- Super Key\n- Candidate Key\n- Primary Key\n- Unique Key\n- Composite Key\n\nFinally, consider the relation:\nStudent(SID, Name, Email, Phone)\n\nAssume:\n- Each student has a unique SID\n- Email is also unique\n- Multiple students may have the same name\n\nIdentify all possible keys for this relation and briefly justify your answer.", "model_answer": "Answer 1: Schema and Instance\n\nA schema is the logical structure of a database that defines tables, attributes, and relationships. It is stable and does not change frequently.\nAn instance is the actual data stored in the database at a specific moment in time.\n\nExample:\nSchema: Student(SID, Name, Email, Phone)\nInstance: (1, Rahim, rahim@gmail.com\n, 017xxx)\n\nTypes of Keys\nSuper Key: Any set of attributes that uniquely identifies a record.\nExample: {SID}, {Email}, {SID, Name}\nCandidate Key: Minimal super key (no redundant attribute).\nExample: {SID}, {Email}\nPrimary Key: Selected candidate key used to uniquely identify records.\nExample: SID\nUnique Key: Ensures uniqueness but may allow NULL values.\nExample: Email\nComposite Key: A key made using more than one attribute.\nExample: (SID, Phone) in some cases\nGiven Relation: Stud d during execution.\n\nComparison:\n| Method Overloading                                              | Method Overriding                                              |\n| --------------------------------------                         | ----------------------------------------                     |\n| Happens within the same class                         | Happens between parent and child classes |\n| Same method name, different parameters | Same method name, same parameters        |\n| Compile-time polymorphism                            | Run-time polymorphism                                     |\n| Inheritance not required                                     | Inheritance required                                             |\n\n\n\n\n\nExample:\n\nclass Area {\n    int calculate(int side) {\n        return side * side;\n    }\n\n    int calculate(int length, int width) {\n        return length * width;\n    }\n}\n\nclass Bird {\n    void fly() {\n        System.out.println(\"Bird flies\");\n    }\n}\n\nclass Sparrow extends Bird {\n    void fly() {\n        System.out.println(\"Sparrow flies low\");\n    }\n}\n\ncalculate() is overloaded and fly() is overridden..", "rubric_levels": "Excellent (4): Clearly defines method\n overloading as same\n method name with different\n parameter lists in the same\n class; mentions compile-time \npolymorphism correctly | Good (3): Defines correctly but \nmisses one important aspect\n(e.g., compile-time polymorphism \nor parameter variation) | Average (2): Partial definition with \nlimited clarity | Poor (1): Incorrect or missing definition"}, {"example_id": "470_c1", "criterion_index": 1, "criterion_name": "Definition of Method Overriding", "max_score": 4.0, "answer_id": 470, "image_file": "images/470.png", "question": "Differentiate between method overloading and method overriding (in Java) with examples.", "model_answer": "\nDefinition of Method Overloading:\n Method overloading occurs when multiple methods in the same clas ereby increasing sales and enhancing customer satisfaction. Similarly, banks can detect fraudulent transactions by identifying unusual patterns in account activity, which helps prevent financial losses.\nRubrics for DataMining ", "rubric_levels": "Excellent (4): Clear and correct definition explaining discovery of useful patterns/knowledge from large datasets | Good (3): Correct definition but slightly incomplete | Average (2): Basic idea mentioned but not clearly defined | Poor (0-1): Incorrect or missing definition"}, {"example_id": "320_kdd", "criterion_index": 1, "criterion_name": "KDD Process Steps", "max_score": 4.0, "answer_id": 320, "image_file": "images/320.png", "question": "What is Data Mining? Describe the steps of the KDD (Knowledge Discovery in Databases) process and explain why data mining is essential in modern organizations.", "model_answer": "Definition of Data Mining:\nData mining is the process of discovering meaningful patterns, knowledge, or useful information from large datasets using techniques from statistics, machine learning, and pattern recognition.\nSteps of the KDD Process:\nThe Knowledge Discovery in Databases (KDD) process includes the following main steps:\n1. Data Selection\n2. Data Preprocessing / Cleaning\n3. Data Transformation\n4. Data Mining\n5. Pattern Evaluation\n6. Knowledge Presentation\nJustification / Importance of Data Mining:\nData mining is essential in modern organizations because it enables data-driven decision making and provides insights that would otherwise remain hidden in large datasets. By analyzing customer behavior, transaction patterns, and market trends, organizations can make strategic decisions that improve efficiency, increase revenue, and reduce risks.\n\nFor example, a retail company can analyze purchase histories to recommend products to customers, thereby increasing sales and enhancing customer satisfaction. Similarly, banks can detect fraudulent transactions by identifying unusual patterns in accoun example_id": "142_c0", "criterion_index": 0, "criterion_name": "Understanding of normalization and related problems(3)", "max_score": 3.0, "answer_id": 142, "image_file": "images/142.png", "question": "Question 1. In database systems, poor design can lead to data redundancy and update anomalies.", "model_answer": "Answer 1: Poor database design leads to data redundancy and update anomalies. Redundancy means storing the same data repeatedly, which increases storage and causes inconsistency. The main anomalies are:\n\nInsertion anomaly: Cannot insert data without adding unrelated information\nDeletion anomaly: Deleting a record may remove useful data\nUpdate anomaly: Same data must be updated in multiple rows\n\nNormalization is used to organize data and eliminate these problems.\n\nNormal Forms:\n\n1NF: Ensures atomic values and removes repeating groups\n2NF: Removes partial dependency (non-key depends on full primary key)\n3NF: Removes transitive dependency (non-key depends only on primary key)\n\nExample:\n\nUnnormalized Table:\nStudentID | Course | Instructor | InstructorPhone\n1 | DBMS | Rahim | 017XX\n1 | AI | Karim | 018XX\n\nProblems: Instructor data is repeated → redundancy and update anomaly.\n\nAfter Normalization:\n\nStudentCourse:\nStudentID | Course\n\nCourseInstructor:\nCourse | Instructor | InstructorPhone\n\nNow redundancy is minimized and anomalies are removed.\nAnswer 2:A poorly designed database suffers from redundancy and update anomalies, which reduce data consistency.\n\nSuppose we have a table:\nOrderID | CustomerName | CustomerAddress | Product\n\nIf a customer places multiple orders, their address is stored repeatedly → data redundancy.\n\nAnomalies:\n\nInsertion anomaly: Cannot add a new customer without an order\nDeletion anomaly: Deleting last order removes customer info\nUpdate anomaly: Changing address requires multiple updates\n\nTo solve this, we apply normalization.\n\nNormal Forms:\n\n1NF: Removes repeating attributes\n2NF: Eliminates partial dependency\n3NF: Eliminates transitive dependency\n\nNormalized Tables:\n\nCustomer:\nCustomerID | Name | Address\n\nOrder:\nOrderID | CustomerID | Product\n\nNow each fact is stored once, reducing redundancy and eliminating anomalies.\nAnswer 3: Poor database design causes redundant data storage and anomalies (insertion, deletion, update), leading to inconsistency.\n\nNormalization is a step-by-step process to improve database structure.\n\nExample (Unnormalized Table):\nStudentID | StudentName | Course | Instructor | InstructorOffice\n\nProblems:\n\nInstructor details repeated → redundancy\nUpdate anomaly if instructor office changes\nStep 1: Convert to 1NF\n\nEnsure atomic values (already satisfied, no repeating groups)\n\nStep 2: Convert to 2NF\n\nRemove partial dependency:\n\nStudentName depends only on StudentID\n\nStudent Table:\nStudentID | StudentName\n\nStep 3: Convert to 3NF\n\nRemove transitive dependency:\n\nInstructorOffice depends on Instructor\n\nCourse Table:\nCourse | Instructor\n\nInstructor Table:\nInstructor | InstructorOffice\n\nNow:\n\nNo redundant data\nAll anomalies removed\nDatabase is well-structured\nRubrics", "rubric_levels": "Excellent (2/3): Clearly explains normalization purpose; correctly identifies redundancy and all anomalies (insertion, deletion, update) with reasoning | Good (0.5-2):  Explains normalization and anomalies but misses depth or one type | Average (0.2-0.5):  Basic idea; anomalies unclear or partially incorrect | Poor (0-0.2):  No clear understanding; mostly incorrect"}, {"example_id": "142_c1", "criterion_index": 1, "criterion_name": "Explanation of normal forms(3)", "max_score": 3.0, "answer_id": 142, "image_file": "images/142.png", "question": "Question 1. In database systems, poor design can lead to data redundancy and update anomalies.", "model_answer": "Answer 1: Poor database design leads to data redundancy and update anomalies. Redundancy means storing the same data repeatedly, which increases storag ion": "Question Q9: Explain necessity of histogram equalization and histogram matching in Image Processing. (10 Marks)", "model_answer": "Definition of Histogram Equalization\n\nHistogram Equalization is a technique used in image processing to enhance the contrast of an image by redistributing its intensity values so that they are spread more uniformly across the entire range.\nNecessity of Histogram Equalization\n\nHistogram equalization is necessary for several important reasons:\n\nContrast Enhancement: Many images suffer from low contrast where pixel values are concentrated in a narrow range. Histogram equalization spreads these values, improving contrast.\nBetter Visibility of Details: It enhances details in dark or bright regions, making features more distinguishable.\nImproved Image Interpretation: Useful in applications like medical imaging (e.g., X-rays, MRI), remote sensing, and surveillance systems.\nPreprocessing Step: Helps improve the performance of further image processing tasks such as segmentation and feature extraction.\nDefinition of Histogram Matching\n\nHistogram Matching (also called histogram specification) is a technique where the histogram of an input image is transformed to match the histogram of a reference image.\nNecessity of Histogram Matching\nHistogram matching is important due to the following reasons:\nConsistency Across Images: Ensures uniform appearance between multiple images.\nHandling Lighting Variations: Useful when images are captured under different lighting conditions.\nImproved Comparison: Makes image comparison more reliable by normalizing intensity distributions.\nBetter Performance in ML Systems: Enhances accuracy in image recognition and machine learning models.\nImage Normalization: Helps in standardizing datasets for analysis.\nRubrics for Digital Image Processing", "rubric_levels": "Excellent (4): Clearly defines and explains redistribution of intensity values with purpose of contrast enhancement | Good (3): Correct but missing one key aspect | Average (2): Basic idea present but unclear | Poor (1): Incorrect or missing definition"}, {"example_id": "103_c1", "criterion_index": 1, "criterion_name": "Necessity of Histogram Equalization", "max_score": 4.0, "answer_id": 103, "image_file": "images/103.png", "question": "Question Q9: Explain necessity of histogram equalization and histogram matching in Image Processing. (10 Marks)", "model_answer": "Definition of Histogram Equalization\n\nHistogram Equalization is a technique used in image processing to enhance the contrast of an image by redistributing its intensity values so that they are spread more uniformly across the entire range.\nNecessity of Histogram Equalization\n\nHistogram equalization is necessary for several important reasons:\n\nContrast Enhancement: Many images suffer from low contrast where pixel values are concentrated in a narrow range. Histogram equalization spreads these values, improving contrast.\nBetter Visibility of Details: It enhances details in dark or bright regions, making features more distinguishable.\nImproved Image Interpretation: Useful in applications like medical imaging (e.g., X-rays, MRI), remote sensing, and surveillance systems.\nPreprocessing Step: Helps improve the performance of further image processing tasks such as segmentation and feature extraction.\nDefinition of Histogram Matching\n\nHistogram Matching (also called histogram specification) is a technique where the histogram of an input image is transformed to match the histogram of a reference image.\nNecessity of Histogram Matching\nHistogram matching is important due to the following reasons:\nConsistency Across Images: Ensures uniform appearance between multiple images.\nHandling Lighting Variations: Useful when images are captured under different lighting conditions.\nImproved Comparison: Makes image comparison more reliable by normalizing intensity distributions.\nBetter Performance in ML Systems: Enhances accuracy in image rec s a fundamental step in digital image processing.\nPurpose of Quantization:\nThe main purposes of quantization are:\n\nData Reduction: It reduces the number of bits required to store image data by limiting intensity levels.\nImage Compression: It plays a key role in compression techniques such as JPEG by reducing redundancy.\nSimplification: It simplifies image processing and analysis by reducing the range of pixel values.\nRole of Max-Lloyd Algorithm\n\nThe Max-Lloyd algorithm is an iterative optimization technique used to design an efficient quantizer by minimizing distortion, typically measured using Mean Squared Error (MSE).\nIt improves quantization by adapting the quantization levels based on the statistical distribution of image data.\nRole of Max-Lloyd Algorithm:\nThe Max-Lloyd algorithm is an optimization technique used to design an efficient quantizer by minimizing distortion, typically measured using Mean Squared Error (MSE). it is used to minimize quantization error (Mean Squared Error). It optimizes quantization levels based on data distribution using:\n             1. Boundary Condition: Decision boundaries are midpoints between levels\n             2. Centroid Condition: Each level equals the mean of assigned values\nThis iterative optimization reduces distortion and improves representation accuracy.\nRubrics for Digital Image Processing ", "rubric_levels": "Excellent (2.5): Clearly explains BOTH conditions with correct meaning | Good (2): Explains only one condition correctly | Average (1.5): Mentions both but incorrectly or vaguely | Poor (1): Not mentioned"}, {"example_id": "12_c0", "criterion_index": 0, "criterion_name": "Importance of R² and Variability (eg. 0.85 or 85%) explained by the model", "max_score": 3.0, "answer_id": 12, "image_file": "images/12.png", "question": "Explain the meaning of R² in regression analysis, interpret values such as R² ≈ 1, R² ≈ 0, and R² < 0, and discuss how Adjusted R² helps in model comparison and addressing over ": "Enables comparison between models and overfitting issues", "max_score": 3.0, "answer_id": 12, "image_file": "images/12.png", "question": "Explain the meaning of R² in regression analysis, interpret values such as R² ≈ 1, R² ≈ 0, and R² < 0, and discuss how Adjusted R² helps in model comparison and addressing overfitting.", "model_answer": "Rubrics for Machine Learning", "rubric_levels": "Excellent (3): Clarity & Organization | Good (2): Well-structured, clear, logical answer | Average (1): Basic idea mentioned with weak understanding | Poor (0): Incorrect auction type or no answer"}, {"example_id": "247_c0", "criterion_index": 0, "criterion_name": "Identification of Layers (2 Marks)", "max_score": 2.0, "answer_id": 247, "image_file": "images/247.png", "question": "Q19: describe the 7 layers of OSI model (10 Marks)", "model_answer": "The OSI (Open Systems Interconnection) model is a conceptual framework that divides network communication into seven layers, each responsible for a specific function. This layered approach helps in understanding, designing, and troubleshooting network systems.\nOSI Model Diagram\n+---------------------+\n| 7. Application      |\n+---------------------+\n| 6. Presentation     |\n+---------------------+\n| 5. Session          |\n+---------------------+\n| 4. Transport        |\n+---------------------+\n| 3. Network          |\n+---------------------+\n| 2. Data Link        |\n+---------------------+\n| 1. Physical         |\n+---------------------+\n1. Physical Layer\nThe Physical layer is responsible for transmitting raw bits over a physical medium. It deals with hardware components such as cables, connectors, and electrical signals, ensuring that data is physically sent from one device to another.\n\n2. Data Link Layer\nThe Data Link layer ensures reliable communication between directly connected devices by organizing data into frames and performing error detection. It also uses MAC addresses to identify devices within the same network.\n\n3. Network Layer\nThe Network layer handles logical addressing and routing, determining the best path for data packets to travel from the source to the destination across multiple networks. Protocols such as IP operate at this layer.\n\n4. Transport Layer\nThe Transport layer provides reliable data transfer through segmentation, flow control, and error recovery. It uses protocols like TCP for reliable communication and UDP for faster, connectionless transmission.\n\n5. Session Layer\nThe Session layer is responsible for establishing, managing, and terminating communication sessions between applications. It maintains synchronization and controls the dialog during data exchange.\n\n6. Presentation Layer\nThe Presentation layer focuses on data representation by translating, encrypting, and compressing data so that it can be properly understood by the receiving system. Technologies such as SSL/TLS operate at this level.\n\n7. Application Layer\nThe Application layer is the topmost layer and provides network services directly to end users and applications. It enables interaction with the network through protocols such as HTTP, FTP, and SMTP.\nRubrics", "rubric_levels": "Excellent: All 7 layers listed in correct order (2.0) | Good: 5–6 correct, minor order issue (1.5) | Average: 3–4 correct (1.0) | Poor: ≤2 or incorrect (0–0.5)"}, {"example_id": "247_c1", "criterion_index": 1, "criterion_name": "Explanation of Layers with diagram (4 Marks)", "max_score": 4.0, "answer_id": 247, "image_file": "images/247.png", "question": "Q19: describe the 7 layers of OSI model (10 Marks)", "model_answer": "The OSI (Open Systems Interconnection) model is a conceptual framework that divides network communication into seven layers, each responsible for a specific function. This layered approach helps in understanding, designing, and troubleshooting network systems.\nOSI Model Diagram\n+---------------------+\n| 7. Application      |\n+---------------------+\n| 6. Presentation     |\n+ revent financial losses.\nRubrics for DataMining ", "rubric_levels": "Excellent (4): Clear and correct definition explaining discovery of useful patterns/knowledge from large datasets | Good (3): Correct definition but slightly incomplete | Average (2): Basic idea mentioned but not clearly defined | Poor (0-1): Incorrect or missing definition"}, {"example_id": "291_kdd", "criterion_index": 1, "criterion_name": "KDD Process Steps", "max_score": 4.0, "answer_id": 291, "image_file": "images/291.png", "question": "What is Data Mining? Describe the steps of the KDD (Knowledge Discovery in Databases) process and explain why data mining is essential in modern organizations.", "model_answer": "Definition of Data Mining:\nData mining is the process of discovering meaningful patterns, knowledge, or useful information from large datasets using techniques from statistics, machine learning, and pattern recognition.\nSteps of the KDD Process:\nThe Knowledge Discovery in Databases (KDD) process includes the following main steps:\n1. Data Selection\n2. Data Preprocessing / Cleaning\n3. Data Transformation\n4. Data Mining\n5. Pattern Evaluation\n6. Knowledge Presentation\nJustification / Importance of Data Mining:\nData mining is essential in modern organizations because it enables data-driven decision making and provides insights that would otherwise remain hidden in large datasets. By analyzing customer behavior, transaction patterns, and market trends, organizations can make strategic decisions that improve efficiency, increase revenue, and reduce risks.\n\nFor example, a retail company can analyze purchase histories to recommend products to customers, thereby increasing sales and enhancing customer satisfaction. Similarly, banks can detect fraudulent transactions by identifying unusual patterns in account activity, which helps prevent financial losses.\nRubrics for DataMining ", "rubric_levels": "Excellent (4): Most or all steps correctly identified (selection, preprocessing, tr /143.png", "question": "Question 1. In database systems, poor design can lead to data redundancy and update anomalies.", "model_answer": "Answer 1: Poor database design leads to data redundancy and update anomalies. Redundancy means storing the same data repeatedly, which increases storage and causes inconsistency. The main anomalies are:\n\nInsertion anomaly: Cannot insert data without adding unrelated information\nDeletion anomaly: Deleting a record may remove useful data\nUpdate anomaly: Same data must be updated in multiple rows\n\nNormalization is used to organize data and eliminate these problems.\n\nNormal Forms:\n\n1NF: Ensures atomic values and removes repeating groups\n2NF: Removes partial dependency (non-key depends on full primary key)\n3NF: Removes transitive dependency (non-key depends only on primary key)\n\nExample:\n\nUnnormalized Table:\nStudentID | Course | Instructor | InstructorPhone\n1 | DBMS | Rahim | 017XX\n1 | AI | Karim | 018XX\n\nProblems: Instructor data is repeated → redundancy and update anomaly.\n\nAfter Normalization:\n\nStudentCourse:\nStudentID | Course\n\nCourseInstructor:\nCourse | Instructor | InstructorPhone\n\nNow redundancy is minimized and anomalies are removed.\nAnswer 2:A poorly designed database suffers from redundancy and update anomalies, which reduce data consistency.\n\nSuppose we have a table:\nOrderID | CustomerName | CustomerAddress | Product\n\nIf a customer places multiple orders, their address is stored repeatedly → data redundancy.\n\nAnomalies:\n\nInsertion anomaly: Cannot add a new customer without an order\nDeletion anomaly: Deleting last order removes customer info\nUpdate anomaly: Changing address requires multiple updates\n\nTo solve this, we apply normalization.\n\nNormal Forms:\n\n1NF: Removes repeating attributes\n2NF: Eliminates partial dependency\n3NF: Eliminates transitive dependency\n\nNormalized Tables:\n\nCustomer:\nCustomerID | Name | Address\n\nOrder:\nOrderID | CustomerID | Product\n\nNow each fact is stored once, reducing redundancy and eliminating anomalies.\nAnswer 3: Poor database design causes redundant data storage and anomalies (insertion, deletion, update), leading to inconsistency.\n\nNormalization is a step-by-step process to improve database structure.\n\nExample (Unnormalized Table):\nStudentID | StudentName | Course | Instructor | InstructorOffice\n\nProblems:\n\nInstructor details repeated → redundancy\nUpdate anomaly if instructor office changes\nStep 1: Convert to 1NF\n\nEnsure atomic values (already satisfied, no repeating groups)\n\nStep 2: Convert to 2NF\n\nRemove partial dependency:\n\nStudentName depends only on StudentID\n\nStudent Table:\nStudentID | StudentName\n\nStep 3: Convert to 3NF\n\nRemove transitive dependency:\n\nInstructorOffice depends on Instructor\n\nCourse Table:\nCourse | Instructor\n\nInstructor Table:\nInstructor | InstructorOffice\n\nNow:\n\nNo redundant data\nAll anomalies removed\nDatabase is well-structured\nRubrics", "rubric_levels": "Excellent (2/3): Clearly explains normalization purpose; correctly identifies redundancy and all anomalies (insertion, deletion, update) with reasoning | Good (0.5-2):  Explains normalization and anomalies but misses depth or one type | Average (0.2-0.5):  Basic idea; anomalies unclear or partially incorrect | Poor (0-0.2):  No clear understanding; mostly incorrect"}, {"example_id": "143_c1", "criterion_index": 1, "criterion_name": "Explanation of normal forms(3)", "max_score": 3.0, "answer_id": 143, "image_file": "images/143.png", "question": "Question 1. In database systems, poor design can lead to data redundancy and update anomalies.", "model_answer": "Answer 1: Poor database design leads to data redundancy and update anomalies. Redundancy means storing the same data repeatedly, which increases storage and causes inconsistency. The main anomalies are:\n\nInsertion anomaly: Cannot insert data without adding unrelated information\nDeletion anomaly: Deleting a record may remove ation into seven layers, each responsible for a specific function. This layered approach helps in understanding, designing, and troubleshooting network systems.\nOSI Model Diagram\n+---------------------+\n| 7. Application      |\n+---------------------+\n| 6. Presentation     |\n+---------------------+\n| 5. Session          |\n+---------------------+\n| 4. Transport        |\n+---------------------+\n| 3. Network          |\n+---------------------+\n| 2. Data Link        |\n+---------------------+\n| 1. Physical         |\n+---------------------+\n1. Physical Layer\nThe Physical layer is responsible for transmitting raw bits over a physical medium. It deals with hardware components such as cables, connectors, and electrical signals, ensuring that data is physically sent from one device to another.\n\n2. Data Link Layer\nThe Data Link layer ensures reliable communication between directly connected devices by organizing data into frames and performing error detection. It also uses MAC addresses to identify devices within the same network.\n\n3. Network Layer\nThe Network layer handles logical addressing and routing, determining the best path for data packets to travel from the source to the destination across multiple networks. Protocols such as IP operate at this layer.\n\n4. Transport Layer\nThe Transport layer provides reliable data transfer through segmentation, flow control, and error recovery. It uses protocols like TCP for reliable communication and UDP for faster, connectionless transmission.\n\n5. Session Layer\nThe Session layer is responsible for establishing, managing, and terminating communication sessions between applications. It maintains synchronization and controls the dialog during data exchange.\n\n6. Presentation Layer\nThe Presentation layer focuses on data representation by translating, encrypting, and compressing data so that it can be properly understood by the receiving system. Technologies such as SSL/TLS operate at this level.\n\n7. Application Layer\nThe Application layer is the topmost layer and provides network services directly to end users and applications. It enables interaction with the network through protocols such as HTTP, FTP, and SMTP.\nRubrics", "rubric_levels": "Excellent: All 7 layers listed in correct order (2.0) | Good: 5–6 correct, minor order issue (1.5) | Average: 3–4 correct (1.0) | Poor: ≤2 or incorrect (0–0.5)"}, {"example_id": "268_c1", "criterion_index": 1, "criterion_name": "Explanation of Layers with diagram (4 Marks)", "max_score": 4.0, "answer_id": 268, "image_file": "images/268.png", "question": "Q19: describe the 7 layers of OSI model (10 Marks)", "model_answer": "The OSI (Open Systems Interconnection) model is a conceptual framework that divides network communication into seven layers, each responsible for a specific function. This layered approach helps in understanding, designing, and troubleshooting network systems.\nOSI Model Diagram\n+---------------------+\n| 7. Application      |\n+---------------------+\n| 6. Presentation     |\n+---------------------+\n| 5. Session          |\n+---------------------+\n| 4. Transport        |\n+---------------------+\n| 3. Network          |\n+---------------------+\n| 2. Data Link        |\n+---------------------+\n| 1. Physical         |\n+---------------------+\n1. Physical Layer\nThe Physical layer is responsible for transmitting raw bits over a physical medium. It deals with hardware components such as cables, connectors, and electrical signals, ensuring that data is physically sent from one device to another.\n\n2. Data Link Layer\nThe Data Link layer ensures reliable communication between directly connected devices by organizing data into frames and performing error detection. It also uses MAC addresses to identify devices within the same network.\n\n3. Network Layer\nThe Network layer handles logical addressing and routing, determining the best path for data packets to travel from the source to the destination across mu s are:\n\nInsertion anomaly: Cannot insert data without adding unrelated information\nDeletion anomaly: Deleting a record may remove useful data\nUpdate anomaly: Same data must be updated in multiple rows\n\nNormalization is used to organize data and eliminate these problems.\n\nNormal Forms:\n\n1NF: Ensures atomic values and removes repeating groups\n2NF: Removes partial dependency (non-key depends on full primary key)\n3NF: Removes transitive dependency (non-key depends only on primary key)\n\nExample:\n\nUnnormalized Table:\nStudentID | Course | Instructor | InstructorPhone\n1 | DBMS | Rahim | 017XX\n1 | AI | Karim | 018XX\n\nProblems: Instructor data is repeated → redundancy and update anomaly.\n\nAfter Normalization:\n\nStudentCourse:\nStudentID | Course\n\nCourseInstructor:\nCourse | Instructor | InstructorPhone\n\nNow redundancy is minimized and anomalies are removed.\nAnswer 2:A poorly designed database suffers from redundancy and update anomalies, which reduce data consistency.\n\nSuppose we have a table:\nOrderID | CustomerName | CustomerAddress | Product\n\nIf a customer places multiple orders, their address is stored repeatedly → data redundancy.\n\nAnomalies:\n\nInsertion anomaly: Cannot add a new customer without an order\nDeletion anomaly: Deleting last order removes customer info\nUpdate anomaly: Changing address requires multiple updates\n\nTo solve this, we apply normalization.\n\nNormal Forms:\n\n1NF: Removes repeating attributes\n2NF: Eliminates partial dependency\n3NF: Eliminates transitive dependency\n\nNormalized Tables:\n\nCustomer:\nCustomerID | Name | Address\n\nOrder:\nOrderID | CustomerID | Product\n\nNow each fact is stored once, reducing redundancy and eliminating anomalies.\nAnswer 3: Poor database design causes redundant data storage and anomalies (insertion, deletion, update), leading to inconsistency.\n\nNormalization is a step-by-step process to improve database structure.\n\nExample (Unnormalized Table):\nStudentID | StudentName | Course | Instructor | InstructorOffice\n\nProblems:\n\nInstructor details repeated → redundancy\nUpdate anomaly if instructor office changes\nStep 1: Convert to 1NF\n\nEnsure atomic values (already satisfied, no repeating groups)\n\nStep 2: Convert to 2NF\n\nRemove partial dependency:\n\nStudentName depends only on StudentID\n\nStudent Table:\nStudentID | StudentName\n\nStep 3: Convert to 3NF\n\nRemove transitive dependency:\n\nInstructorOffice depends on Instructor\n\nCourse Table:\nCourse | Instructor\n\nInstructor Table:\nInstructor | InstructorOffice\n\nNow:\n\nNo redundant data\nAll anomalies removed\nDatabase is well-structured\nRubrics", "rubric_levels": "Excellent (2/3): Clearly explains normalization purpose; correctly identifies redundancy and all anomalies (insertion, deletion, update) with reasoning | Good (0.5-2):  Explains normalization and anomalies but misses depth or one type | Average (0.2-0.5):  Basic idea; anomalies unclear or partially incorrect | Poor (0-0.2):  No clear understanding; mostly incorrect"}, {"example_id": "173_c1", "criterion_index": 1, "criterion_name": "Explanation of normal forms(3)", "max_score": 3.0, "answer_id": 173, "image_file": "images/173.png", "question": "Question 1. In database systems, poor design can lead to data redundancy and update anomalies.", "model_answer": "Answer 1: Poor database design leads to data redundancy and update anomalies. Redundancy means storing the same data repeatedly, which increases storage and causes inconsistency. The main anomalies are:\n\nInsertion anomaly: Cannot insert data without adding unrelated information\nDeletion anomaly: Deleting a record may remove useful data\nUpdate anomaly: Same data must be updated in multiple rows\n\nNormalization is used to organize data and eliminate these problems.\n\nNormal Forms:\n\n1NF: Ensures atomic values and removes repeating groups\n2NF: Removes partial dependency (non-key depends on full primary key)\n3NF: Removes transitive dependency (non-ke stance\n\nA schema is the logical structure of a database that defines tables, attributes, and relationships. It is stable and does not change frequently.\nAn instance is the actual data stored in the database at a specific moment in time.\n\nExample:\nSchema: Student(SID, Name, Email, Phone)\nInstance: (1, Rahim, rahim@gmail.com\n, 017xxx)\n\nTypes of Keys\nSuper Key: Any set of attributes that uniquely identifies a record.\nExample: {SID}, {Email}, {SID, Name}\nCandidate Key: Minimal super key (no redundant attribute).\nExample: {SID}, {Email}\nPrimary Key: Selected candidate key used to uniquely identify records.\nExample: SID\nUnique Key: Ensures uniqueness but may allow NULL values.\nExample: Email\nComposite Key: A key made using more than one attribute.\nExample: (SID, Phone) in some cases\nGiven Relation: Student(SID, Name, Email, Phone)\nCandidate Keys: SID, Email (both are unique)\nSuper Keys: Any combination containing SID or Email\nExample: {SID}, {Email}, {SID, Name}, {Email, Phone}\nPrimary Key: SID (assumed)\nUnique Key: Email\nComposite Key: Not required here since single attributes are already unique\n\nAnswer 2: Schema vs Instance\n\nSchema defines the structure of a database (tables, attributes, constraints). It is like a blueprint.\nInstance is the actual data stored in the database at a specific time.\n\nExample:\nSchema: Student(SID, Name, Email, Phone)\nInstance: (101, Karim, karim@gmail.com\n, 018xxx)\n\nTypes of Keys\nSuper Key: A set of attributes that can uniquely identify a tuple.\nExample: SID or (SID, Name)\nCandidate Key: A minimal version of super key with no extra attribute.\nExample: SID, Email\nPrimary Key: Chosen candidate key for identification.\nExample: SID\nUnique Key: Ensures all values are unique (can be multiple per table).\nExample: Email\nComposite Key: A key formed by combining multiple attributes.\nExample: (SID, Name) if needed\nKeys in Given Relation\n\nStudent(SID, Name, Email, Phone)\n\nSID → unique → candidate key\ ntify devices within the same network.\n\n3. Network Layer\nThe Network layer handles logical addressing and routing, determining the best path for data packets to travel from the source to the destination across multiple networks. Protocols such as IP operate at this layer.\n\n4. Transport Layer\nThe Transport layer provides reliable data transfer through segmentation, flow control, and error recovery. It uses protocols like TCP for reliable communication and UDP for faster, connectionless transmission.\n\n5. Session Layer\nThe Session layer is responsible for establishing, managing, and terminating communication sessions between applications. It maintains synchronization and controls the dialog during data exchange.\n\n6. Presentation Layer\nThe Presentation layer focuses on data representation by translating, encrypting, and compressing data so that it can be properly understood by the receiving system. Technologies such as SSL/TLS operate at this level.\n\n7. Application Layer\nThe Application layer is the topmost layer and provides network services directly to end users and applications. It enables interaction with the network through protocols such as HTTP, FTP, and SMTP.\nRubrics", "rubric_levels": "Excellent: All 7 layers listed in correct order (2.0) | Good: 5–6 correct, minor order issue (1.5) | Average: 3–4 correct (1.0) | Poor: ≤2 or incorrect (0–0.5)"}, {"example_id": "228_c1", "criterion_index": 1, "criterion_name": "Explanation of Layers with diagram (4 Marks)", "max_score": 4.0, "answer_id": 228, "image_file": "images/228.png", "question": "Q19: describe the 7 layers of OSI model (10 Marks)", "model_answer": "The OSI (Open Systems Interconnection) model is a conceptual framework that divides network communication into seven layers, each responsible for a specific function. This layered approach helps in understanding, designing, and troubleshooting network systems.\nOSI Model Diagram\n+---------------------+\n| 7. Application      |\n+--------------- ame class                         | Happens between parent and child classes |\n| Same method name, different parameters | Same method name, same parameters        |\n| Compile-time polymorphism                            | Run-time polymorphism                                     |\n| Inheritance not required                                     | Inheritance required                                             |\n\n\n\n\n\nExample:\n\nclass Area {\n    int calculate(int side) {\n        return side * side;\n    }\n\n    int calculate(int length, int width) {\n        return length * width;\n    }\n}\n\nclass Bird {\n    void fly() {\n        System.out.println(\"Bird flies\");\n    }\n}\n\nclass Sparrow extends Bird {\n    void fly() {\n        System.out.println(\"Sparrow flies low\");\n    }\n}\n\ncalculate() is overloaded and fly() is overridden..", "rubric_levels": "Excellent (4): Clearly defines method\n overloading as same\n method name with different\n parameter lists in the same\n class; mentions compile-time \npolymorphism correctly | Good (3): Defines correctly but \nmisses one important aspect\n(e.g., compile-time polymorphism \nor parameter variation) | Average (2): Partial definition with \nlimited clarity | Poor (1): Incorrect or missing definition"}, {"example_id": "481_c1", "criterion_index": 1, "criterion_name": "Definition of Method Overriding", "max_score": 4.0, "answer_id": 481, "image_file": "images/481.png", "question": "Differentiate between method overloading and method overriding (in Java) with examples.", "model_answer": "\nDefinition of Method Overloading:\n Method overloading occurs when multiple methods in the same class have the same name but different parameter lists (different number, type, or order of parameters). It is an example of compile-time polymorphism because the compiler determines which method will be executed.\n\nDefinition of Method Overriding: \nMethod overriding occurs when a subclass provides a new implementation of a hen multiple methods in the same class have the same name but different parameter lists (different number, type, or order of parameters). It is an example of compile-time polymorphism because the compiler determines which method will be executed.\n\nDefinition of Method Overriding: \nMethod overriding occurs when a subclass provides a new implementation of a method already defined in the parent class using the same method signature. It is an example of run-time polymorphism because the method call is resolved during execution.\n\nComparison:\n| Method Overloading                                              | Method Overriding                                              |\n| --------------------------------------                         | ----------------------------------------                     |\n| Happens within the same class                         | Happens between parent and child classes |\n| Same method name, different parameters | Same method name, same parameters        |\n| Compile-time polymorphism                            | Run-time polymorphism                                     |\n| Inheritance not required                                     | Inheritance required                                             |\n\n\n\n\n\nExample:\n\nclass Area {\n    int calculate(int side) {\n        return side * side;\n    }\n\n    int calculate(int length, int width) {\n        return length * width;\n    }\n}\n\nclass Bird {\n    void fly() {\n        System.out.println(\"Bird flies\");\n    }\n}\n\nclass Sparrow extends Bird {\n    void fly() {\n        System.out.println(\"Sparrow flies low\");\n    }\n}\n\ncalculate() is overloaded and fly() is overridden..", "rubric_levels": "Excellent (4): Clearly identifies at least \n4 major differences: \nclass relationship, parameters, \nbinding time, inheritance \nrequirement | Good (3): Identifies 3 differences \ncorrectly | Average (2): Identifies 2 differences\n | Poor (1): Very limited or incorrect \ncomparison"}, {"example_id": "481_ex", "criterion_index": 3, "criterion_name": "Example / Application", "max_score": 4.0, "answer_id": 481, "image_file": "images/481.png", "question": "Differentiate between method overloading and method overriding (in Java) with examples.", "model_answer": "\nDefinition of Method Overloading:\n Method overloading occurs when multiple methods in the same class have the same name but different parameter lists (different number, type, or order of parameters). It is an example of compile-time polymorphism because the compiler determines which method will be executed.\n\nDefinition of Method Overriding: \nMethod overriding occurs when a subclass provides a new implementation of a method already defined in the parent class using the same method signature. It is an example of run-time polymorphism because the method call is resolved during execution.\n\nComparison:\n| Method Overloading                                              | Method Overriding                                              |\n| --------------------------------------                         | ----------------------------------------                     |\n| Happens within the same class                         | Happens between parent and child classes |\n| Same method name, different parameters | Same method name, same parameters        |\n| Compile-time polymorphism                            | Run-time polymorphism                                     |\n| Inheritance not required                                     | Inheritance required                                             |\n\n\n\n\n\nExample:\n\nclass Area {\n    int calculate(int side) {\n        return side * side;\n    }\n\n    int calculate(int length, int width) {\n        return length * width;\n    }\n}\n\nclass Bird {\n    void fly() {\n        System.out.println(\"Bird flies\");\n    }\n}\n\nclass Sparrow extends Bird {\n    void fly() {\n        System.out.println(\"Sparrow flies low\");\n    }\n}\n\ncalculate() is overloaded and fly() is overridden..", "rubric_levels": "Excellent (4): Provides correct and \ncomplete programming \nexample for both overloading\n and overriding with clear \nexplanation | Good (3): Example mostly\ncorrect\n with minor error | Average (2): Partial example or \nonly one concept shown | Poor (1): No valid example"}, {"example_id": "144_c0", "criterion_index": 0, "criterion_name": "Understanding of normalization and related problems(3)", "max_score": 3.0, "answer_id": 144, "image_file": "images/144.png", "question": "Question 1. In database systems, poor design can lead to data redundancy and update anomalies.", "model_answer": "Answer 1: Poor database design leads to data redundancy and update anomalies. Redundancy means storing the same data repeatedly, which increases storage and causes inconsistency. The main anomalies are:\n\nInsertion anomaly: Cannot insert data without adding unrelated information\nDeletion anomaly: Deleting a record may remove useful data\nUpdate anomaly: Same data must be updated in multiple rows\n\nNormalization is used to organize data and eliminate these problems.\n\nNormal Forms:\n\n1NF: Ensures atomic values and removes repeating groups\n2NF: Removes partial dependency (non-key depends on full primary key)\n3NF: Removes transitive dependency (non-key depends only on primary key)\n\nExample:\n\nUnnormalized Table:\nStudentID | Course | Instructor | InstructorPhone\n1 | DBMS | Rahim | 017XX\n1 | AI | Karim | 018XX\n\nProblems: Instructor data is repeated → redundancy and update anomaly.\n\nAfter Normalization:\n\nStudentCourse:\nStudentID | Course\n\nCourseInstructor:\nCourse | Instructor | InstructorPhone\n\nNow redundancy is minimized and anomalies are removed.\nAnswer 2:A poorly designed database suffers from redundancy and update anomalies, which reduce data consistency.\n\nSuppose we have a table:\nOrderID | CustomerName | CustomerAddress | Product\n\nIf a customer places multiple orders, their address is stored repeatedly → data redundancy.\n\nAnomalies:\n\nInsertion anomaly: Cannot add a new customer without an order\nDeletion anomaly: Deleting last order removes customer info\nUpdate anomaly: Changing address requires multiple updates\n\nTo solve this, we apply normalization.\n\nNormal Forms:\n\n1NF: Removes repeating attributes\n2NF: Eliminates partial dependency\n3NF: Eliminates transitive dependency\n\nNormalized Tables:\n\nCustomer:\nCustomerID | Name | Address\n\nOrder:\nOrderID | CustomerID | Product\n\nNow each fact is stored once, reducing redundancy and eliminating anomalies.\nAnswer 3: Poor database design causes redundant data storage and anomalies (insertion, deletion, update), leading to inconsistency.\n\nNormalization is a step-by-step process to improve database structure.\n\nExample (Unnormalized Table):\nStudentID | StudentName | Course | Instructor | InstructorOffice\n\nProblems:\n\nInstructor details repeated → redundancy\nUpdate anomaly if instructor office changes\nStep 1: Convert to 1NF\n\nEnsure atomic values (already satisfied, no repeating groups)\n\nStep 2: Convert to 2NF\n\nRemove partial dependency:\n\nStudentName depends only on StudentID\n\nStudent Table:\nStudentID | StudentName\n\nStep 3: Convert to 3NF\n\nRemove transitive dependency:\n\nInstructorOffice depends on Instructor\n\nCourse Table:\nCourse | Instructor\n\nInstructor Table:\nInstructor | InstructorOffice\n\nNow:\n\nNo redundant data\nAll anomalies removed\nDatabase is well-structured\nRubrics", "rubric_levels": "Excellent (2/3): Clearly explains normalization purpose; correctly identifies redundancy and all anomalies (insertion, deletion, update) with reasoning | Good (0.5-2):  Explains normalization and anomalies but misses depth or one type | Average (0.2-0.5):  Basic idea; anomalies unclear or partially incorrect | Poor (0-0.2):  No clear understanding; mostly incorrect"}, {"example_id": "144_c1", "criterion_index": 1, "criterion_name": "Explanation of normal forms(3 ddress\n\nOrder:\nOrderID | CustomerID | Product\n\nNow each fact is stored once, reducing redundancy and eliminating anomalies.\nAnswer 3: Poor database design causes redundant data storage and anomalies (insertion, deletion, update), leading to inconsistency.\n\nNormalization is a step-by-step process to improve database structure.\n\nExample (Unnormalized Table):\nStudentID | StudentName | Course | Instructor | InstructorOffice\n\nProblems:\n\nInstructor details repeated → redundancy\nUpdate anomaly if instructor office changes\nStep 1: Convert to 1NF\n\nEnsure atomic values (already satisfied, no repeating groups)\n\nStep 2: Convert to 2NF\n\nRemove partial dependency:\n\nStudentName depends only on StudentID\n\nStudent Table:\nStudentID | StudentName\n\nStep 3: Convert to 3NF\n\nRemove transitive dependency:\n\nInstructorOffice depends on Instructor\n\nCourse Table:\nCourse | Instructor\n\nInstructor Table:\nInstructor | InstructorOffice\n\nNow:\n\nNo redundant data\nAll anomalies removed\nDatabase is well-structured\nRubrics", "rubric_levels": "Excellent (2/3):  Correctly explains 1NF, 2NF, 3NF with conditions and how they remove anomalies | Good (0.5-2):  Explains normal forms with minor mistakes or missing details | Average (0.2-0.5):  Mentions normal forms but incomplete/partially wrong | Poor (0-0.2): Incorrect or missing explanation"}, {"example_id": "144_c2", "criterion_index": 2, "criterion_name": "Use of example(2)", "max_score": 2.0, "answer_id": 144, "image_file": "images/144.png", "question": "Question 1. In database systems, poor design can lead to data redundancy and update anomalies.", "model_answer": "Answer 1: Poor database design leads to data redundancy and update anomalies. Redundancy means storing the same data repeatedly, which increases storage and causes inconsistency. The main anomalies are:\n\nInsertion anomaly: Cannot insert data without adding unrelated information\nDeletion anomaly: Deleting a record may remove useful data\nUpdate a cause the method call is resolved during execution.\n\nComparison:\n| Method Overloading                                              | Method Overriding                                              |\n| --------------------------------------                         | ----------------------------------------                     |\n| Happens within the same class                         | Happens between parent and child classes |\n| Same method name, different parameters | Same method name, same parameters        |\n| Compile-time polymorphism                            | Run-time polymorphism                                     |\n| Inheritance not required                                     | Inheritance required                                             |\n\n\n\n\n\nExample:\n\nclass Area {\n    int calculate(int side) {\n        return side * side;\n    }\n\n    int calculate(int length, int width) {\n        return length * width;\n    }\n}\n\nclass Bird {\n    void fly() {\n        System.out.println(\"Bird flies\");\n    }\n}\n\nclass Sparrow extends Bird {\n    void fly() {\n        System.out.println(\"Sparrow flies low\");\n    }\n}\n\ncalculate() is overloaded and fly() is overridden..", "rubric_levels": "Excellent (4): Clearly defines method\n overloading as same\n method name with different\n parameter lists in the same\n class; mentions compile-time \npolymorphism correctly | Good (3): Defines correctly but \nmisses one important aspect\n(e.g., compile-time polymorphism \nor parameter variation) | Average (2): Partial definition with \nlimited clarity | Poor (1): Incorrect or missing definition"}, {"example_id": "479_c1", "criterion_index": 1, "criterion_name": "Definition of Method Overriding", "max_score": 4.0, "answer_id": 479, "image_file": "images/479.png", "question": "Differentiate between method overloading and method overriding (in Java) with examples.", "model_answer": "\nDefinition of Method Overloading:\n Method overloading occurs when m nt calculate(int side) {\n        return side * side;\n    }\n\n    int calculate(int length, int width) {\n        return length * width;\n    }\n}\n\nclass Bird {\n    void fly() {\n        System.out.println(\"Bird flies\");\n    }\n}\n\nclass Sparrow extends Bird {\n    void fly() {\n        System.out.println(\"Sparrow flies low\");\n    }\n}\n\ncalculate() is overloaded and fly() is overridden..", "rubric_levels": "Excellent (4): Provides correct and \ncomplete programming \nexample for both overloading\n and overriding with clear \nexplanation | Good (3): Example mostly\ncorrect\n with minor error | Average (2): Partial example or \nonly one concept shown | Poor (1): No valid example"}, {"example_id": "400_c0", "criterion_index": 0, "criterion_name": "Understanding of Concept", "max_score": 4.0, "answer_id": 400, "image_file": "images/400.png", "question": "Question 1. You are given the following values: 12, -5.4, 10000, 3.14, 0, 87, -200, 45.6, 999, 1.2. Choose the most efficient among Counting Sort, Radix Sort, or Bucket Sort for this dataset. Justify your selection and state the time and space complexity of all three algorithms.\n2. A directed weighted graph is given below. Determine whether the graph contains a negative cycle using a step-by-step solution. Graph (text form): Vertices = {A, B, C, D}; Edges = A→B (4), B→C (-6), C→D (2), D→B (1), A→D (5).\n3. You are given coin denominations: 1, 3, 4, 5. Find the minimum number of coins required to make 10 taka. Show the DP table and derive the final answer.", "model_answer": "Answer 1: Bucket Sort is the most efficient for this dataset because it contains floating-point numbers and a wide range of values including negatives. Counting Sort is not suitable due to large range and non-integers, and Radix Sort is inefficient for floating-point values. Time Complexity: Counting Sort = O(n + k), Space = O(k); Radix Sort = O(d(n + k)), Space = O(n + k); Bucket Sort = O(n + k) average, worst O(n²), Space = O(n + k). Therefore, Bucket Sort is preferred.\nAnswer 2: Using Bellman-Ford algorithm: Step 1 initialize distances (A=0, others=∞). Step 2 relax edges repeatedly: A→B (4), B→C (-6), C→D (2), D→B (1). After V-1 iterations, distances keep decreasing due to cycle B→C→D→B with total weight (-6 + 2 + 1 = -3). Step 3 one more relaxation still reduces distance, confirming a negative cycle exists. Therefore, the graph contains a negative cycle.\nAnswer 3: Using Dynamic Programming: Let dp[x] = minimum coins to make x. Initialize dp[0]=0. Fill table up to 10: dp[1]=1, dp[2]=2, dp[3]=1, dp[4]=1, dp[5]=1, dp[6]=2, dp[7]=2, dp[8]=2, dp[9]=2, dp[10]=2. Minimum coins for 10 = 2 (5+5 or 4+3+3 is larger). Final answer: 2 coins.\nRubrics", "rubric_levels": "Excellent (4): Fully correct and clearly demonstrates the concept | Good (3): Mostly correct with minor issues | Average (2): Partial understanding | Poor (1): Shows little understanding; answer mostly incorrect"}, {"example_id": "400_c1", "criterion_index": 1, "criterion_name": "Step-by-Step Procedure", "max_score": 4.0, "answer_id": 400, "image_file": "images/400.png", "question": "Question 1. You are given the following values: 12, -5.4, 10000, 3.14, 0, 87, -200, 45.6, 999, 1.2. Choose the most efficient among Counting Sort, Radix Sort, or Bucket Sort for this dataset. Justify your selection and state the time and space complexity of all three algorithms.\n2. A directed weighted graph is given below. Determine whether the graph contains a negative cycle using a step-by-step solution. Graph (text form): Vertices = {A, B, C, D}; Edges = A→B (4), B→C (-6), C→D (2), D→B (1), A→D (5).\n3. You are given coin denominations: 1, 3, 4, 5. Find the minimum number of coins required to make 10 taka. Show the DP table and derive the final answer.", "model_answer": "Answer 1: Bucket Sort is the most efficient for this dataset because it contains floating-point numbers and a wide range of values including negatives. Counting Sort is not suitable due ), A→D (5).\n3. You are given coin denominations: 1, 3, 4, 5. Find the minimum number of coins required to make 10 taka. Show the DP table and derive the final answer.", "model_answer": "Answer 1: Bucket Sort is the most efficient for this dataset because it contains floating-point numbers and a wide range of values including negatives. Counting Sort is not suitable due to large range and non-integers, and Radix Sort is inefficient for floating-point values. Time Complexity: Counting Sort = O(n + k), Space = O(k); Radix Sort = O(d(n + k)), Space = O(n + k); Bucket Sort = O(n + k) average, worst O(n²), Space = O(n + k). Therefore, Bucket Sort is preferred.\nAnswer 2: Using Bellman-Ford algorithm: Step 1 initialize distances (A=0, others=∞). Step 2 relax edges repeatedly: A→B (4), B→C (-6), C→D (2), D→B (1). After V-1 iterations, distances keep decreasing due to cycle B→C→D→B with total weight (-6 + 2 + 1 = -3). Step 3 one more relaxation still reduces distance, confirming a negative cycle exists. Therefore, the graph contains a negative cycle.\nAnswer 3: Using Dynamic Programming: Let dp[x] = minimum coins to make x. Initialize dp[0]=0. Fill table up to 10: dp[1]=1, dp[2]=2, dp[3]=1, dp[4]=1, dp[5]=1, dp[6]=2, dp[7]=2, dp[8]=2, dp[9]=2, dp[10]=2. Minimum coins for 10 = 2 (5+5 or 4+3+3 is larger). Final answer: 2 coins.\nRubrics", "rubric_levels": "Excellent (4): Very clear, neat diagrams/tables, strong justification | Good (3): Clear explanation | Average (2): Understandable but not neat | Poor (1): Poorly organized"}, {"example_id": "216_c0", "criterion_index": 0, "criterion_name": "Identification of Layers (2 Marks)", "max_score": 2.0, "answer_id": 216, "image_file": "images/216.png", "question": "Q19: describe the 7 layers of OSI model (10 Marks)", "model_answer": "The OSI (Open Systems Interconnection) model is a conceptual framework that divides network communication into seven layers, each responsible for a specific function. This layered approach helps in understanding, designing, and troubleshooting network systems.\nOSI Model Diagram\n+---------------------+\n| 7. Application      |\n+---------------------+\n| 6. Presentation     |\n+---------------------+\n| 5. Session          |\n+---------------------+\n| 4. Transport        |\n+---------------------+\n| 3. Network          |\n+---------------------+\n| 2. Data Link        |\n+---------------------+\n| 1. Physical         |\n+---------------------+\n1. Physical Layer\nThe Physical layer is responsible for transmitting raw bits over a physical medium. It deals with hardware components such as cables, connectors, and electrical signals, ensuring that data is physically sent from one device to another.\n\n2. Data Link Layer\nThe Data Link layer ensures reliable communication between directly connected devices by organizing data into frames and performing error detection. It also uses MAC addresses to identify devices within the same network.\n\n3. Network Layer\nThe Network layer handles logical addressing and routing, determining the best path for data packets to travel from the source to the destination across multiple networks. Protocols such as IP operate at this layer.\n\n4. Transport Layer\nThe Transport layer provides reliable data transfer through segmentation, flow control, and error recovery. It uses protocols like TCP for reliable communication and UDP for faster, connectionless transmission.\n\n5. Session Layer\nThe Session layer is responsible for establishing, managing, and terminating communication sessions between applications. It maintains synchronization and controls the dialog during data exchange.\n\n6. Presentation Layer\nThe Presentation layer focuses on data representation by translating, encrypting, and compressing data so that it can be properly understood by the receiving system. Technologies such as SSL/TLS operate at this level.\n\n7. Application Layer\nThe Application layer is the topmost layer and provides network services directly to end users and applications. It enables interaction with the network through protocols such as HTTP, FTP, and SMTP.\nRubrics", "rubric_levels": "Excellent: All 7 layers listed in correct order (2.0) | Good: 5–6 correct, minor order issue (1.5) | Average: 3–4 correct (1.0) | Poor: ≤2 or incorrect (0–0.5)"}, {"example_id": "216_c1", "criterion_index": 1, "criterion_name": "Explanation of Layers with diagram (4 Marks)", "max_score": 4.0, "answer_id": 216, "image_file": "images/216.png", "question": "Q19: describe the 7 layers of OSI model (10 Marks)", "model_answer": "The OSI (Open Systems Interconnection) model is a conceptual framework that divides network communication into seven layers, each responsible for a specific function. This layered approach helps in understanding, designing, and troubleshooting network systems.\nOSI Model Diagram\n+---------------------+\n| 7. Application      |\n+---------------------+\n| 6. Presentation     |\n+---------------------+\n| 5. Session          |\n+---------------------+\n| 4. Transport        |\n+---------------------+\n| 3. Network          |\n+---------------------+\n| 2. Data Link        |\n+---------------------+\n| 1. Physical         |\n+---------------------+\n1. Physical Layer\nThe Physical layer is responsible for transmitting raw bits over a physical medium. It deals with hardware components such as cables, connectors, and electrical signals, ensuring that data is physically sent from one device to another.\n\n2. Data Link Layer\nThe Data Link layer ensures reliable communication between directly connected devices by organizing data into frames and performing error detection. It also uses MAC addresses to identify devices within the same network.\n\n3. Network Layer\nThe Network layer handles logical addressing and routing, determining the best path for data packets to travel from the source to the destination across multiple networks. Protocols such as IP operate at this layer.\n\n4. Transport Layer\nThe Transport laye ization:\nThe main purposes of quantization are:\n\nData Reduction: It reduces the number of bits required to store image data by limiting intensity levels.\nImage Compression: It plays a key role in compression techniques such as JPEG by reducing redundancy.\nSimplification: It simplifies image processing and analysis by reducing the range of pixel values.\nRole of Max-Lloyd Algorithm\n\nThe Max-Lloyd algorithm is an iterative optimization technique used to design an efficient quantizer by minimizing distortion, typically measured using Mean Squared Error (MSE).\nIt improves quantization by adapting the quantization levels based on the statistical distribution of image data.\nRole of Max-Lloyd Algorithm:\nThe Max-Lloyd algorithm is an optimization technique used to design an efficient quantizer by minimizing distortion, typically measured using Mean Squared Error (MSE). it is used to minimize quantization error (Mean Squared Error). It optimizes quantization levels based on data distribution using:\n             1. Boundary Condition: Decision boundaries are midpoints between levels\n             2. Centroid Condition: Each level equals the mean of assigned values\nThis iterative optimization reduces distortion and improves representation accuracy.\nRubrics for Digital Image Processing ", "rubric_levels": "Excellent (2.5): Clearly defines quantization as mapping continuous values to discrete levels AND mentions image/pixel context | Good (2): Defines quantization correctly but lacks context (e.g., image or pixels not mentioned) | Average (1.5): Mentions discretization but unclear or partially incorrect | Poor (1): No definition OR completely incorrect concept"}, {"example_id": "39_c1", "criterion_index": 1, "criterion_name": "Purpose of Quantization", "max_score": 2.5, "answer_id": 39, "image_file": "images/39.png", "question": "What is the purpose of quantization in image processing? Describe the role of the Max-Lloyd algorithm in minimizing distortion.", "model_a
